# Tag a release by itself, so nobody has to push a version tag by hand (the owner, 2026-10-31).
#
#   push to main that changes pyproject.toml  ->  if the version in it has no vX.Y.Z tag yet:
#       1. create the GitHub release vX.Y.Z on that commit, with its CHANGELOG.md section as notes
#          (this also creates the git tag);
#       2. start release.yml on the new tag (build -> Grype gates -> sign, attest, move :X.Y.Z, :X.Y, :latest).
#
# A tag made with the workflow's own token starts no other workflow (GitHub's rule against recursion),
# so step 2 starts release.yml by hand (workflow_dispatch, which that rule allows) on the tag's ref.
# The image's signing identity is then release.yml@refs/tags/vX.Y.Z, as with a tag pushed by a person,
# so scripts/verify-image.sh checks it the same way.
#
# Run it by hand to tag an older release: give the version and the commit on main. With "publish"
# off it only creates the git tag (no GitHub release, no image), for a version whose release.yml had
# no workflow_dispatch trigger yet (0.18.0 and older).
#
# The gate is the pull request into main (required checks, the branch ruleset). docs/maintainers.md,
# "Releasing", describes the flow; the tag ruleset for v* must let GitHub Actions create tags.
name: Tag release

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, for example 0.17.0 (blank: the version in pyproject.toml on the commit)"
        type: string
        default: ""
      commit:
        description: "Commit on main to tag (blank: the newest commit on main)"
        type: string
        default: ""
      publish:
        description: "Create the GitHub release and build the image (off: only the git tag)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: tag the version in pyproject.toml
    # Forks never tag; a run started by hand must run the workflow as it is on main.
    if: github.repository == 'ksullivan86/kidney-health' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # create the GitHub release and its tag; nothing is pushed to a branch
      actions: write         # start release.yml on the new tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Work out the version and the commit
        id: v
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_COMMIT: ${{ inputs.commit }}
          IN_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          commit="${IN_COMMIT:-$GITHUB_SHA}"
          case "$commit" in (*[!0-9a-f]*|'') echo "commit must be a hex commit id" >&2; exit 1;; esac
          commit="$(git rev-parse --verify "${commit}^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main || { echo "$commit is not on main" >&2; exit 1; }
          at_commit="$(git show "${commit}:pyproject.toml" | sed -n 's/^version = "\([^"]*\)"$/\1/p' | head -n 1)"
          version="${IN_VERSION:-$at_commit}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "not a version: '$version'" >&2; exit 1
          fi
          if [ "$version" != "$at_commit" ]; then
            echo "pyproject.toml on $commit says '$at_commit', not '$version'" >&2; exit 1
          fi
          tag="v${version}"
          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --silent 2>/dev/null; then
            echo "${tag} already exists: nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "skip=false"
            echo "tag=${tag}"
            echo "version=${version}"
            echo "commit=${commit}"
            echo "publish=${IN_PUBLISH}"
          } >> "$GITHUB_OUTPUT"
          echo "will tag ${tag} at ${commit} (publish: ${IN_PUBLISH})"
      - name: Create the GitHub release and its tag
        if: steps.v.outputs.skip == 'false' && steps.v.outputs.publish == 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          COMMIT: ${{ steps.v.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git show "${COMMIT}:CHANGELOG.md" | awk -v h="## ${VERSION} " 'index($0, h) == 1 {p=1; next} /^## /{p=0} p' > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md on ${COMMIT} has no '## ${VERSION} ' section" >&2; exit 1
          fi
          # GitHub refuses notes over 125,000 characters, and release.yml appends the image block.
          size="$(LC_ALL=C.UTF-8 wc -m < "$RUNNER_TEMP/notes.md")"
          if [ "$size" -gt 100000 ]; then
            printf 'The notes for %s are too long for a GitHub release. Read them in CHANGELOG.md at this tag.\n' "$VERSION" > "$RUNNER_TEMP/notes.md"
          fi
          prerelease=()
          case "$VERSION" in (*-*) prerelease=(--prerelease);; esac
          gh release create "$TAG" --target "$COMMIT" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
      - name: Create the git tag only
        if: steps.v.outputs.skip == 'false' && steps.v.outputs.publish != 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
          COMMIT: ${{ steps.v.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${COMMIT}" --silent
      - name: Start the release image build on the tag
        if: steps.v.outputs.skip == 'false' && steps.v.outputs.publish == 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref "$TAG"
          echo "started release.yml on ${TAG}; watch 'Release image' in the Actions tab"
