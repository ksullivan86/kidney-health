# Weekly live check of the Open Food Facts mapping (docs/dev/research/03-barcode-and-photo.md §6 item 19,
# §5 "OFF changes the schema again"). Tests never use the network; this job asks the Open Food Facts
# staging server for the recorded fixture products with the app's own request and checks that the
# pinned API still returns flat nutriments, that the newest API's nutrition object still parses to the
# same values, and that every product still maps to a food (scripts/check_off_live.py).
#
# Warn-only: a problem is reported as a warning annotation on the run; nothing is written anywhere.
# (The other half of item 19, comparing the vendored barcode decoder with npm, belongs to the
# frontend's vendor/ files and their own check.)
name: Open Food Facts live check

on:
  schedule:
    - cron: "41 5 * * 3"   # Wednesdays 05:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: off-live-check
  cancel-in-progress: false

jobs:
  off-live:
    name: Open Food Facts staging (mapping still valid)
    if: github.repository == 'ksullivan86/kidney-health'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the app's dependencies (hash-locked)
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: -r requirements.lock
      - name: Check the mapping against staging
        id: check
        continue-on-error: true
        run: python scripts/check_off_live.py
      - name: Report
        if: steps.check.outcome == 'failure'
        run: echo "::warning title=Open Food Facts::the live check found problems; see the 'Check the mapping against staging' step and docs/barcode-and-photos.md"
