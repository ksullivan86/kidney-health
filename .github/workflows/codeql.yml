# CodeQL code scanning: Python, JavaScript and the workflows themselves (actions: script injection,
# excessive permissions). Spec: docs/dev/research/01-rootless-and-security.md §3.6, §5.4.
#
# Code scanning is free for PUBLIC repositories; a private repository needs GitHub Code Security.
# The `visibility` job asks the API whether this repository is public (that works for every event,
# including the weekly schedule) and the analysis runs only then, so this workflow switches on by
# itself when the repository goes public. Until then zizmor and actionlint (ci.yml) cover the
# workflows; docs/security.md explains the gap.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"   # Mondays 04:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visibility:
    name: repository visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          private="$(gh api "repos/${REPO}" --jq .private)"
          if [ "$private" = false ]; then echo "public=true" >> "$GITHUB_OUTPUT"; else echo "public=false" >> "$GITHUB_OUTPUT"; fi
          echo "private=${private}"

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          dependency-caching: false
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
