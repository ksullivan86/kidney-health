# Build the iPhone app, sign it and upload it to TestFlight (design note 15 §4.4, step 3).
#
# Started by hand only (Actions -> TestFlight -> Run workflow), from main. The job uses the "release"
# environment, so it waits for a person to approve it when that environment has required reviewers.
#
# Signing is Apple's cloud signing: xcodebuild signs in with the App Store Connect API key and makes
# the distribution certificate and profile it needs. No certificate or profile is stored anywhere.
# The key lives in three secrets of the "release" environment, written to a file for this job only
# and deleted at the end:
#
#   ASC_KEY_ID      the key's ID
#   ASC_ISSUER_ID   the issuer ID shown above the keys list
#   ASC_KEY_P8      the whole .p8 file, BEGIN and END lines included
#
# The key needs the Admin role, because only Admin keys may use cloud-managed certificates.
# The build number is this workflow's run number, so every upload has a new one.
name: TestFlight

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: build, sign, upload to TestFlight
    if: github.ref == 'refs/heads/main'
    # Xcode 27 builds with the iOS 27 SDK, which App Store Connect requires from April 2027. GitHub's "xcode-27" runner image
    # (macOS 27, arm64) is a public preview: actions/runner-images issue 14404.
    runs-on: xcode-27
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    env:
      XCODE_VERSION: "27.2"
      TEAM_ID: "579992SASJ"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Pack the web app into the iPhone app (design note 38; scripts/build_preview.py --device)
        run: python scripts/build_preview.py --device ios/WebApp
      - name: Check the three secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Add these secrets to the release environment:$missing"
            exit 1
          fi
          case "$ASC_KEY_P8" in
            *"BEGIN PRIVATE KEY"*"END PRIVATE KEY"*) ;;
            *) echo "::error::ASC_KEY_P8 must be the whole .p8 file, with its BEGIN and END lines"; exit 1 ;;
          esac
      - name: Archive, sign and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          archive="$RUNNER_TEMP/KidneyHealth.xcarchive"
          xcodebuild archive -quiet \
            -project ios/KidneyHealth.xcodeproj -scheme KidneyHealth -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$archive" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            "${auth[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          options="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :destination string upload" \
            -c "Add :teamID string $TEAM_ID" \
            -c "Add :signingStyle string automatic" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            -c "Add :uploadSymbols bool true" \
            "$options"
          xcodebuild -exportArchive \
            -archivePath "$archive" -exportOptionsPlist "$options" -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}"
          echo "Uploaded build $GITHUB_RUN_NUMBER. It shows in TestFlight once Apple has processed it (5 to 30 minutes)."
