# Continuous integration: tests, parity, linters and a hardened container smoke test.
# Nothing here publishes anything: images are built locally and thrown away (release.yml publishes).
# Spec: docs/dev/research/01-rootless-and-security.md §3.6, §5.4, §7 Phase E.
#
# Supply-chain rules for every workflow in this repository (checked by tests/test_deploy.py, zizmor
# and actionlint): `permissions: {}` at the top and per-job grants; every `uses:` pinned to a full
# commit SHA with a `# vX.Y.Z` comment (Dependabot updates both); `persist-credentials: false` on
# every checkout; no pull_request_target; downloaded tools checked against a pinned SHA-256; no
# caches (nothing to poison); event data reaches shell steps only through env variables.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned tool releases (re-verify: docs/dev/research/01-rootless-and-security.md §8).
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  HADOLINT_VERSION: "2.14.0"
  HADOLINT_SHA256: "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47"
  KUBECONFORM_VERSION: "v0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  KUSTOMIZE_VERSION: "v5.8.2"
  KUSTOMIZE_SHA256: "06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95"
  GRYPE_VERSION: "v0.120.0"
  BUILDKIT_IMAGE: "moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea"

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.12: the oldest Python the CI covers (requires-python stays >=3.11 for source users).
        # 3.14: the Python inside the published image (Chainguard python:latest).
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the hash-locked dependencies (wheels only)
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Run tests (no network needed)
        run: python -m pytest

  js-parity:
    name: JS parity vectors (Node)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Browser rules engine matches the server (tests/data/*.json)
        run: node tests/js/run_vectors.mjs

  lint:
    name: lint (workflows, Containerfiles, manifests, scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Download pinned tools and verify their SHA-256
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          fetch() { # url sha256 file
            curl -fsSL --retry 3 -o "$3" "$1"
            echo "$2  $3" | sha256sum --check --strict -
          }
          fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256" actionlint.tgz
          tar -xzf actionlint.tgz -C "$bin" actionlint
          fetch "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64" "$HADOLINT_SHA256" hadolint
          install -m 0755 hadolint "$bin/hadolint"
          fetch "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" "$KUBECONFORM_SHA256" kubeconform.tgz
          tar -xzf kubeconform.tgz -C "$bin" kubeconform
          fetch "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" "$KUSTOMIZE_SHA256" kustomize.tgz
          tar -xzf kustomize.tgz -C "$bin" kustomize
          echo "$bin" >> "$GITHUB_PATH"
      - name: Every action is pinned to a full commit SHA
        run: |
          set -euo pipefail
          # A `uses:` must be a local path, a docker:// image by digest, or owner/repo@<40 hex>.
          bad=$(grep -rnE '^\s*(-\s*)?uses:' .github/workflows .github/actions 2>/dev/null \
            | grep -vE 'uses:\s*\./' \
            | grep -vE 'uses:\s*docker://[^ ]+@sha256:[0-9a-f]{64}' \
            | grep -vE 'uses:\s*[^@ ]+@[0-9a-f]{40}(\s+#\s*v[0-9][^ ]*)\s*$' || true)
          if [ -n "$bad" ]; then echo "Unpinned or uncommented uses: lines:"; echo "$bad"; exit 1; fi
          echo "all uses: lines are SHA-pinned with a version comment"
      - name: actionlint
        run: actionlint -color
      - name: hadolint (both Containerfiles and the Caddy example)
        run: hadolint --config .hadolint.yaml deploy/Containerfile deploy/Containerfile.debian deploy/caddy/Containerfile
      - name: kustomize build + kubeconform (strict)
        run: |
          set -euo pipefail
          kustomize build deploy/k8s > "$RUNNER_TEMP/rendered.yaml"
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP/rendered.yaml" \
            deploy/k8s/secret.example.yaml deploy/k8s/ingress.example.yaml deploy/k8s/cilium-networkpolicy.example.yaml \
            deploy/k8s/restore-pod.example.yaml
      - name: Compose files resolve (docker compose config)
        run: |
          set -euo pipefail
          install -d -m 0700 deploy/secrets deploy/caddy
          : > deploy/secrets/secret_key; : > deploy/secrets/usda_api_key
          : > deploy/caddy/Caddyfile; : > deploy/caddy/caddy.env
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml -f deploy/compose.ai-ollama.yaml config --quiet
          PUBLIC_URL=https://food.example.net:8443 \
            docker compose -f deploy/compose.yaml -f deploy/compose.caddy.yaml config --quiet
      - name: YAML parses (every *.yml / *.yaml in the repository)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: -r .github/requirements-lint.txt
          python .github/scripts/yaml_parse.py
      - name: shellcheck (deploy and CI scripts)
        run: shellcheck --version && shellcheck scripts/verify-image.sh deploy/docker-rootless-run.sh .github/scripts/smoke-test.sh

  zizmor:
    name: zizmor (workflow security audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs on private repositories too. Online audits (impostor commits, known-vulnerable
      # actions) use the read-only job token. Results are annotations: no upload, no write scope.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          advanced-security: false
          annotations: true
          persona: regular

  dependency-review:
    name: dependency review
    # Needs the dependency graph, which is free for public repositories only.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  image:
    name: image (${{ matrix.variant }}) build + smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: chainguard
            file: deploy/Containerfile
            smoke-args: ""
          - variant: debian
            file: deploy/Containerfile.debian
            smoke-args: "--allow-shell"   # the fallback keeps /bin/sh on purpose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The Debian fallback is only rebuilt when something it depends on changed.
      - name: Decide whether to build
        id: gate
        env:
          VARIANT: ${{ matrix.variant }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          build=true
          if [ "$VARIANT" = debian ] && [ "$EVENT" = pull_request ]; then
            if ! git diff --name-only "$BASE_SHA...HEAD" | grep -qE '^(deploy/|requirements[^/]*\.(in|lock)$|\.dockerignore$)'; then
              build=false
              echo "Containerfile.debian inputs unchanged: skipping."
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.gate.outputs.build == 'true'
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
          cache-binary: false
      # linux/amd64 only, loaded into the runner's Docker, never pushed. Attestations are off here
      # because the docker exporter cannot store them; release.yml builds with provenance + SBOM.
      - name: Build
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          push: false
          tags: kidney-health:ci-${{ matrix.variant }}
          provenance: false
          sbom: false
      - name: Smoke test (read-only, cap-drop ALL, as 10001:10001 and as 12345:0)
        if: steps.gate.outputs.build == 'true'
        env:
          IMAGE: kidney-health:ci-${{ matrix.variant }}
          SMOKE_ARGS: ${{ matrix.smoke-args }}
        run: |
          # shellcheck disable=SC2086  # SMOKE_ARGS is empty or one flag
          .github/scripts/smoke-test.sh "$IMAGE" $SMOKE_ARGS
      # Gate: fail on High/Critical vulnerabilities that have a fix available (note 01 §4.3).
      # The weekly scheduled-scan.yml reports everything else.
      - name: Grype gate (High+, fixable only)
        if: steps.gate.outputs.build == 'true' && matrix.variant == 'chainguard'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: kidney-health:ci-chainguard
          grype-version: ${{ env.GRYPE_VERSION }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table

  # ---------------------------------------------------------------------------------------------
  # PLACEHOLDER (M3 integration, docs/dev/research/08-handbook-site.md §4.8): the `handbook` job
  # (pip install --require-hashes -r handbook/requirements.lock; python scripts/build_handbook.py
  # --check; mkdocs build --strict; pytest tests/test_handbook_content.py) and the Playwright CSP
  # smoke test that also loads /learn/. The image job then lists it in `needs:`.
  # ---------------------------------------------------------------------------------------------
