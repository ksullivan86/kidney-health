name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the image job may write packages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/ksullivan86/kidney-health
  KUBECONFORM_VERSION: v0.6.7
  ACTIONLINT_VERSION: 1.7.7

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests (no network needed)
        run: python -m pytest

  deploy-lint:
    name: deployment manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: YAML syntax (deploy/, workflows)
        run: |
          pip install pyyaml
          python - <<'PY'
          import glob, yaml
          files = sorted(glob.glob("deploy/**/*.yaml", recursive=True) + glob.glob(".github/workflows/*.yml"))
          assert files, "no YAML files found"
          for f in files:
              with open(f) as fh:
                  list(yaml.safe_load_all(fh))
              print("ok", f)
          PY
      - name: actionlint (this workflow)
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: kustomize build + kubeconform
        run: |
          set -euo pipefail
          kubectl kustomize deploy/k8s > "$RUNNER_TEMP/rendered.yaml"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/kubeconform" -strict -summary "$RUNNER_TEMP/rendered.yaml" deploy/k8s/secret.example.yaml
          "$RUNNER_TEMP/kubeconform" -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/k8s/httproute.example.yaml
      - name: hadolint (Containerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/Containerfile
          config: .hadolint.yaml
          failure-threshold: warning

  image:
    name: container image
    needs: [test, deploy-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      # Publish only from trusted refs: pushes to main, v* tags, and a manual run on
      # main. Pull requests and manual runs from other branches build amd64 without pushing.
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4

      # arm64 is cross-built under QEMU emulation; only needed when we publish.
      - name: Set up QEMU
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: main -> latest + main + sha-<short>; v1.2.3 -> 1.2.3, 1.2, 1 (no "0" for v0.x).
      # GitHub reports the PolyForm licence as "Other", so the licence label is set here
      # explicitly instead of relying on metadata-action's repository default (NOASSERTION).
      - name: Image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=kidney-health
            org.opencontainers.image.description=Self-hosted food log with renal-diet and type 1 diabetes nutrient warnings
            org.opencontainers.image.documentation=https://github.com/ksullivan86/kidney-health/blob/main/docs/deployment.md
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      # Pull requests / foreign branches: build linux/amd64 only, never push (validates the
      # Containerfile). main / tags: build amd64 + arm64 and push to GHCR.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestation manifests show up as "unknown/unknown" platforms in the GHCR UI
          # and confuse `podman pull`/auto-update on some versions. Re-enable if you want SLSA provenance.
          provenance: false
          sbom: false
