# Continuous integration: tests, parity, linters and a hardened container smoke test.
# Nothing here publishes anything: images are built locally and thrown away (release.yml publishes).
# Spec: docs/dev/research/01-rootless-and-security.md §3.6, §5.4, §7 Phase E.
#
# Supply-chain rules for every workflow in this repository (checked by tests/test_deploy.py, zizmor
# and actionlint): `permissions: {}` at the top and per-job grants; every `uses:` pinned to a full
# commit SHA with a `# vX.Y.Z` comment (Dependabot updates both); `persist-credentials: false` on
# every checkout; no pull_request_target; downloaded tools checked against a pinned SHA-256; no
# caches (nothing to poison); event data reaches shell steps only through env variables.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned tool releases (re-verify: docs/dev/research/01-rootless-and-security.md §8).
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  HADOLINT_VERSION: "2.14.0"
  HADOLINT_SHA256: "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47"
  KUBECONFORM_VERSION: "v0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  KUSTOMIZE_VERSION: "v5.8.2"
  KUSTOMIZE_SHA256: "06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95"
  # ruff: the release's own .sha256 file, checked against the downloaded tarball (0.17.0 is from 2026-10-09).
  RUFF_VERSION: "0.17.0"
  RUFF_SHA256: "c94fc1dc71f054d06d9f1149442dcb471516aa2b7d4b7e8124e05d082d4c91d3"
  GRYPE_VERSION: "v0.120.0"
  BUILDKIT_IMAGE: "moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea"
  # The Swift toolchain for ios/KidneyHealthCore, from swift.org (6.4.1 is from 2026-10-12; its .sig checked against the
  # Swift 6.x release key when this hash was taken).
  SWIFT_VERSION: "6.4.1"
  SWIFT_SHA256: "7d246c7114077ad01dba4ad897628446ada4c489d6c7dbcf39ae3f25cbe17e8b"

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    # The suite takes 16 to 19 minutes on Python 3.15 runners; 20 cut a passing run off at 99 %.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.12: the oldest Python the CI covers (requires-python stays >=3.11 for source users).
        # 3.14: the Python of the Debian fallback image (deploy/Containerfile.debian) and of the handbook build.
        # 3.15: the Python inside the published image (Chainguard python:latest moved to 3.15). setup-python
        #       serves the released 3.15.0, so the plain version string is enough (no prerelease opt-in).
        #       requirements-dev.lock leaves PyYAML out there (no cp315 wheel yet), so the two test modules
        #       that read YAML skip on 3.15.
        python: ["3.12", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the hash-locked dependencies (wheels only)
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Run tests (no network needed)
        run: python -m pytest

  js-parity:
    name: JS parity vectors (Node)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Browser rules engine matches the server (tests/data/*.json)
        run: node tests/js/run_vectors.mjs

  swift:
    name: Swift package for the iOS app (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the pinned Swift toolchain and verify its SHA-256
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          name="swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04"
          curl -fsSL --retry 3 -o swift.tar.gz \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/${name}.tar.gz"
          echo "$SWIFT_SHA256  swift.tar.gz" | sha256sum --check --strict -
          tar -xzf swift.tar.gz && rm swift.tar.gz
          echo "$RUNNER_TEMP/$name/usr/bin" >> "$GITHUB_PATH"
      - name: KidneyHealthCore matches the server (tests/data/body, apple_health and push vectors)
        run: |
          swift --version
          swift test --package-path ios/KidneyHealthCore

  ios-app:
    name: iOS app (simulator build and tests)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      XCODE_VERSION: "26.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the app and run its tests in the simulator (no signing, no Apple account)
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 ios/pick_simulator.py)
          echo "simulator: $udid"
          results="$RUNNER_TEMP/tests.xcresult"
          if ! xcodebuild test -quiet \
            -project ios/KidneyHealthSync.xcodeproj -scheme KidneyHealthSync \
            -destination "id=$udid" -derivedDataPath "$RUNNER_TEMP/derived" -resultBundlePath "$results"; then
            xcrun xcresulttool get test-results summary --path "$results" || true
            xcrun xcresulttool get test-results tests --path "$results" | head -c 20000 || true
            exit 1
          fi

  lint:
    name: lint (workflows, Containerfiles, manifests, scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Download pinned tools and verify their SHA-256
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          fetch() { # url sha256 file
            curl -fsSL --retry 3 -o "$3" "$1"
            echo "$2  $3" | sha256sum --check --strict -
          }
          fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256" actionlint.tgz
          tar -xzf actionlint.tgz -C "$bin" actionlint
          fetch "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64" "$HADOLINT_SHA256" hadolint
          install -m 0755 hadolint "$bin/hadolint"
          fetch "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" "$KUBECONFORM_SHA256" kubeconform.tgz
          tar -xzf kubeconform.tgz -C "$bin" kubeconform
          fetch "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" "$KUSTOMIZE_SHA256" kustomize.tgz
          tar -xzf kustomize.tgz -C "$bin" kustomize
          fetch "https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}/ruff-x86_64-unknown-linux-gnu.tar.gz" "$RUFF_SHA256" ruff.tgz
          tar -xzf ruff.tgz -C "$bin" --strip-components=1 ruff-x86_64-unknown-linux-gnu/ruff
          echo "$bin" >> "$GITHUB_PATH"
      - name: Every action is pinned to a full commit SHA
        run: |
          set -euo pipefail
          # A `uses:` must be a local path, a docker:// image by digest, or owner/repo@<40 hex>.
          bad=$(grep -rnE '^\s*(-\s*)?uses:' .github/workflows .github/actions 2>/dev/null \
            | grep -vE 'uses:\s*\./' \
            | grep -vE 'uses:\s*docker://[^ ]+@sha256:[0-9a-f]{64}' \
            | grep -vE 'uses:\s*[^@ ]+@[0-9a-f]{40}(\s+#\s*v[0-9][^ ]*)\s*$' || true)
          if [ -n "$bad" ]; then echo "Unpinned or uncommented uses: lines:"; echo "$bad"; exit 1; fi
          echo "all uses: lines are SHA-pinned with a version comment"
      - name: actionlint
        run: actionlint -color
      - name: hadolint (both Containerfiles and the Caddy example)
        run: hadolint --config .hadolint.yaml deploy/Containerfile deploy/Containerfile.debian deploy/caddy/Containerfile
      - name: kustomize build + kubeconform (strict)
        run: |
          set -euo pipefail
          kustomize build deploy/k8s > "$RUNNER_TEMP/rendered.yaml"
          kustomize build deploy/k8s-overlays/example > "$RUNNER_TEMP/rendered-overlay.yaml"
          # CRD schemas at a fixed commit: the catalog's Cilium 1.20.2 schema (2026-11-01) has a
          # \u escape in a pattern that kubeconform's Go regexp cannot compile ("could not find schema").
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/6ec4c804fcb9b0a90fec9dd468aa57b984be150a/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP/rendered.yaml" "$RUNNER_TEMP/rendered-overlay.yaml" \
            deploy/k8s/secret.example.yaml deploy/k8s/ingress.example.yaml deploy/k8s/cilium-networkpolicy.example.yaml \
            deploy/k8s/restore-pod.example.yaml
      - name: Compose files resolve (docker compose config)
        run: |
          set -euo pipefail
          install -d -m 0700 deploy/secrets deploy/caddy
          : > deploy/secrets/secret_key; : > deploy/secrets/usda_api_key
          : > deploy/caddy/Caddyfile; : > deploy/caddy/caddy.env
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml -f deploy/compose.ai-ollama.yaml config --quiet
          PUBLIC_URL=https://food.example.net:8443 \
            docker compose -f deploy/compose.yaml -f deploy/compose.caddy.yaml config --quiet
      - name: YAML parses (every *.yml / *.yaml in the repository)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: -r .github/requirements-lint.txt
          python .github/scripts/yaml_parse.py
      - name: shellcheck (deploy and CI scripts)
        run: shellcheck --version && shellcheck scripts/verify-image.sh deploy/docker-rootless-run.sh .github/scripts/smoke-test.sh
      # The rules are in pyproject.toml ([tool.ruff.lint]); findings show up as annotations on the pull request.
      - name: ruff (Python)
        run: ruff check --no-cache --output-format=github .

  zizmor:
    name: zizmor (workflow security audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs on private repositories too. Online audits (impostor commits, known-vulnerable
      # actions) use the read-only job token. Results are annotations: no upload, no write scope.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.30.1"
          advanced-security: false
          annotations: true
          persona: regular

  dependency-review:
    name: dependency review
    # Needs the dependency graph, which is free for public repositories only.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  image:
    name: image (${{ matrix.variant }}) build + smoke test
    # Only build an image from a tree whose tests, linters and handbook pass (note 08 §4.8): the
    # image's handbook stage runs the same strict build.
    needs: [test, lint, handbook]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: chainguard
            file: deploy/Containerfile
            smoke-args: ""
          - variant: debian
            file: deploy/Containerfile.debian
            smoke-args: "--allow-shell"   # the fallback keeps /bin/sh on purpose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The Debian fallback is only rebuilt when something it depends on changed.
      - name: Decide whether to build
        id: gate
        env:
          VARIANT: ${{ matrix.variant }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          build=true
          if [ "$VARIANT" = debian ] && [ "$EVENT" = pull_request ]; then
            if ! git diff --name-only "$BASE_SHA...HEAD" | grep -qE '^(deploy/|requirements[^/]*\.(in|lock)$|\.dockerignore$)'; then
              build=false
              echo "Containerfile.debian inputs unchanged: skipping."
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.gate.outputs.build == 'true'
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
          cache-binary: false
      # linux/amd64 only, loaded into the runner's Docker, never pushed. Attestations are off here
      # because the docker exporter cannot store them; release.yml builds with provenance + SBOM.
      - name: Build
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          push: false
          tags: kidney-health:ci-${{ matrix.variant }}
          provenance: false
          sbom: false
      - name: Smoke test (read-only, cap-drop ALL, as 10001:10001 and as 12345:0)
        if: steps.gate.outputs.build == 'true'
        env:
          IMAGE: kidney-health:ci-${{ matrix.variant }}
          SMOKE_ARGS: ${{ matrix.smoke-args }}
        run: |
          # shellcheck disable=SC2086  # SMOKE_ARGS is empty or one flag
          .github/scripts/smoke-test.sh "$IMAGE" $SMOKE_ARGS
      # Gate: fail on High/Critical vulnerabilities that have a fix available (note 01 §4.3).
      # The weekly scheduled-scan.yml reports everything else.
      - name: Grype gate (High+, fixable only)
        if: steps.gate.outputs.build == 'true' && matrix.variant == 'chainguard'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: kidney-health:ci-chainguard
          grype-version: ${{ env.GRYPE_VERSION }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table

  # The patient handbook (docs/dev/research/08-handbook-site.md §4.8): generated pages current, the
  # strict build the image runs, internal links, the content rules, the app's links into it, and the
  # built site served by the real app in Chromium with zero CSP / Trusted Types violations.
  handbook:
    name: handbook (build, content, links, /learn in Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NO_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the app (hash-locked; the browser check runs the real server)
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Install the handbook toolchain in its own venv (hash-locked)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/hb"
          "$RUNNER_TEMP/hb/bin/python" -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: -r handbook/requirements.lock
      - name: Generated pages are current (scripts/build_handbook.py --check)
        run: '"$RUNNER_TEMP/hb/bin/python" scripts/build_handbook.py --check'
      - name: Strict build, as the image's handbook stage runs it
        working-directory: handbook
        env:
          HANDBOOK_SITE_URL: http://localhost/learn/
          HANDBOOK_APP_LINK: /
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hb/bin/mkdocs" build --strict -d "$RUNNER_TEMP/learn"
          find "$RUNNER_TEMP/learn" -type f -name '*.map' -exec rm -f {} +
      - name: Internal links and anchors of the built site ("/" is the app's own link)
        run: python handbook/tools/check_links.py "$RUNNER_TEMP/learn" --allow /
      - name: Content rules (front matter, sources, no dosing, slugs)
        run: '"$RUNNER_TEMP/hb/bin/python" -m pytest --noconftest -p no:cacheprovider tests/test_handbook_content.py'
      - name: Every /learn link in the app resolves to a built page
        run: HANDBOOK_BUILT_SITE="$RUNNER_TEMP/learn" python -m pytest -p no:cacheprovider tests/test_learn_links.py
      # Playwright from a hash-locked file; the browser is the runner's own Google Chrome, so no
      # browser download happens here.
      - name: Install Playwright (hash-locked)
        run: |
          set -euo pipefail
          python -m venv --system-site-packages "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/python" -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: -r tools/e2e/requirements.lock
      - name: /learn in Chromium (375x812 and 1280x800; CSP, Trusted Types, failed or outside requests)
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pw/bin/python" tools/e2e/learn.py --site "$RUNNER_TEMP/learn" \
            --server-python "$(command -v python)" --out "$RUNNER_TEMP/learn-e2e"

  # Canary for the Material team's successor (note 08 §4.1): allowed to fail. Migrate when a
  # Zensical >= 0.1 release builds the handbook and passes the checks above.
  handbook-zensical:
    name: handbook canary (Zensical; allowed to fail)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Zensical (hash-locked)
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: -r handbook/requirements-zensical.lock
      - name: Build the handbook with Zensical (strict)
        working-directory: handbook
        env:
          HANDBOOK_SITE_URL: http://localhost/learn/
          HANDBOOK_APP_LINK: /
        run: zensical build -f mkdocs.yml -s
