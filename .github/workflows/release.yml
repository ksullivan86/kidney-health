# Publish the image to GHCR: build by digest -> scan -> sign, attest, and only then move the tags.
# Spec: docs/dev/research/01-rootless-and-security.md §5.4 and §10 S7; ARCHITECTURE.md v0.3
# decision 7 (image tags).
#
#   push to main  ->  :edge  and  :sha-<short>
#   tag vX.Y.Z    ->  :X.Y.Z, :X.Y and :latest   (a pre-release such as v0.3.0-rc1 gets only its own tag)
#
# A malicious or mistaken merge therefore reaches only people who track :edge; :latest and :0.3
# move only on a version tag, which the tag ruleset protects. Tags move after the Grype gate passed
# for both platforms, so a vulnerable build never gets a tag.
#
# Signing and attestations need a PUBLIC repository (keyless cosign writes the workflow identity
# to the public Rekor log; GitHub artifact attestations are not available to private repositories
# on Free/Pro plans). Those steps are gated on `github.event.repository.private == false` and switch
# on by themselves when the repository goes public. buildx's in-index provenance (mode=max) and
# SBOM are recorded either way. Users verify with scripts/verify-image.sh (SECURITY.md).
name: Release image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ksullivan86/kidney-health
  GRYPE_VERSION: "v0.120.0"
  COSIGN_VERSION: "v3.1.3"
  # Builder images, pinned by digest (the actions default to floating tags).
  BUILDKIT_IMAGE: "moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea"
  BINFMT_IMAGE: "docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0"

jobs:
  build:
    name: build (amd64 + arm64, push by digest)
    # Forks never publish.
    if: github.repository == 'ksullivan86/kidney-health'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write        # push the image by digest (no tags yet)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # arm64 is cross-built under QEMU emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
          cache-binary: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags are only computed here; the publish job applies them after the scan.
      # GitHub reports the PolyForm licence as "Other", so the licence label is explicit.
      # :latest moves on every non-prerelease v* tag (ARCHITECTURE.md decision 7), unless the
      # repository variable HOLD_LATEST is "true". v0.2's Quadlet unit tracked :latest with
      # AutoUpdate=registry and a shell HealthCmd that fails in the shell-less v0.3 image (a kill and
      # restart loop on every auto-updating v0.2 host), so the owner may hold :latest on the last v0.2
      # digest for a while after v0.3.0 (CHANGELOG.md, "Upgrading from 0.2").
      - name: Image metadata (tags, labels, annotations)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') && vars.HOLD_LATEST != 'true' }}
          labels: |
            org.opencontainers.image.title=kidney-health
            org.opencontainers.image.description=Self-hosted food log with renal-diet and type 1 diabetes nutrient warnings
            org.opencontainers.image.documentation=https://github.com/ksullivan86/kidney-health/blob/main/docs/deployment.md
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
      # Push by digest only: no tag exists until the publish job. mode=max provenance and the SBOM
      # are stored in the image index (unsigned on their own; covered once the index is signed).
      # Never pass secrets as build-args: mode=max provenance records them.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Containerfile
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Built ${IMAGE}@${DIGEST}"
            echo "Tags to apply after the scan:"
            for tag in $TAGS; do echo "- \`${tag}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Grype gate (${{ matrix.platform }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A scanner runs with whatever the job can reach, so this job gets read-only scopes and no
    # secrets (the Trivy compromise of March 2026 is the reason; note 01 §3.6).
    permissions:
      contents: read
      packages: read         # pull the pushed digest from GHCR (private package)
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan (fail on High/Critical with a fix available)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        env:
          GRYPE_PLATFORM: ${{ matrix.platform }}
        with:
          image: registry:${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          grype-version: ${{ env.GRYPE_VERSION }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table

  publish:
    name: sign, attest, tag
    needs: [build, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Optional gate: add required reviewers to the "release" environment in the repository settings
    # (Settings -> Environments), with a deployment rule for main and v* tags.
    environment: release
    permissions:
      contents: read
      packages: write        # move the tags; push signatures and attestations
      id-token: write        # keyless signing (Fulcio) and GitHub attestations
      attestations: write    # store the GitHub attestations
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      TAGS: ${{ needs.build.outputs.tags }}
      PUBLIC: ${{ github.event.repository.private == false }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
          cache-binary: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- public repository only -------------------------------------------------------------
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLIC == 'true'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # Keyless: the certificate names this workflow and ref; the signature is a Sigstore bundle
      # stored as an OCI 1.1 referrer. Signing the index digest covers both platforms and the
      # in-index provenance and SBOM.
      - name: cosign sign (index digest)
        if: env.PUBLIC == 'true'
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: SLSA build provenance (GitHub attestation)
        if: env.PUBLIC == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false   # storage records work only for organisation-owned repos
      - name: SBOM (SPDX, from the published index)
        if: env.PUBLIC == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM attestation (GitHub attestation)
        if: env.PUBLIC == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      # -------------------------------------------------------------------------------------------

      # Last: point the tags at the scanned (and, when public, signed and attested) digest.
      - name: Move tags to the digest
        run: |
          set -euo pipefail
          args=()
          for tag in $TAGS; do args+=(--tag "$tag"); done
          if [ "${#args[@]}" -eq 0 ]; then echo "no tags for this ref"; exit 1; fi
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
          {
            echo "### Published ${IMAGE}@${DIGEST}"
            for tag in $TAGS; do echo "- \`${tag}\`"; done
            echo
            echo "Signed and attested: ${PUBLIC} (public repository only)."
          } >> "$GITHUB_STEP_SUMMARY"
