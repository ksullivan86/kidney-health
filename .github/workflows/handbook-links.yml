# Weekly check of every external link in the patient handbook (docs/dev/research/08-handbook-site.md
# §4.8): the URLs in handbook/sources.yml and every external link of the built site. Sources move;
# a dead guideline link makes a page harder to trust and to review.
#
# On failure it opens one issue labelled "handbook-links" (or comments on the open one) with lychee's
# report; nothing else is written. 403 and 429 count as reachable: NIH, OPTN, TSA, DOL, SSA, AHRQ and
# foodsafety.gov answer 403 to automated requests but work in a browser (note 08 §5.13).
name: Handbook external links

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: handbook-links
  cancel-in-progress: false

jobs:
  links:
    name: lychee (external links)
    if: github.repository == 'ksullivan86/kidney-health'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write   # open or update the one "handbook-links" issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the handbook toolchain (hash-locked)
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: -r handbook/requirements.lock
      # The Pages flavour: its canonical links point at the public URL, not at http://localhost.
      - name: Build the handbook
        working-directory: handbook
        env:
          NO_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict -f mkdocs.pages.yml -d "$RUNNER_TEMP/site"
      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Only http(s) links; code blocks are skipped (they hold example hosts); the site's own
          # canonical and sitemap URLs point at a site that may not be published yet.
          args: >-
            --no-progress
            --scheme https --scheme http
            --accept 200..=299,403,429
            --max-retries 3 --retry-wait-time 10 --timeout 30
            --exclude-all-private
            --exclude '^https?://([a-z0-9-]+\.)*example\.(org|com|net)'
            --exclude '^https?://[^/]*\.(invalid|lan|local|home\.arpa)([:/]|$)'
            --exclude '^https://ksullivan86\.github\.io/kidney-health'
            --exclude-path '${{ runner.temp }}/site/sitemap.xml'
            '${{ runner.temp }}/site/**/*.html'
            handbook/sources.yml
          output: ${{ runner.temp }}/lychee.md
          fail: false
          jobSummary: true
      - name: Open or update the handbook-links issue
        if: steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ runner.temp }}/lychee.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/issue.md"
          {
            echo "The weekly external-link check of the handbook found broken links ($RUN_URL)."
            echo "Replace or remove each one in handbook/sources.yml or the page that uses it, then close this issue."
            echo
            head -c 60000 "$REPORT"
          } > "$body"
          gh label create handbook-links --color D93F0B --description "Broken external links in the handbook" --force
          number="$(gh issue list --label handbook-links --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "Handbook: broken external links" --label handbook-links --body-file "$body"
          fi
