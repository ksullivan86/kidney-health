# Dependabot version updates (docs/dev/research/01-rootless-and-security.md §3.6, §5.4).
# Security updates are never delayed by a cooldown; version updates wait so that a compromised
# release has time to be noticed and yanked before it lands here (C-DEPBOT).
version: 2
updates:
  # Python: requirements.in -> requirements.lock and requirements-dev.lock (pip-compile with
  # --generate-hashes; Dependabot regenerates the hashes), the handbook build lock, and the CI
  # lint tools in /.github.
  - package-ecosystem: pip
    directories:
      - "/"
      - "/handbook"
      - "/.github"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  # GitHub Actions: updates the SHA pins and their "# vX.Y.Z" comments together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Base images: the literal `FROM image:tag@sha256:` lines of deploy/Containerfile and
  # deploy/Containerfile.debian (builder, handbook and runtime bump together in one PR), and the
  # Caddy example. Digests carry security fixes, so check daily with a short cooldown.
  - package-ecosystem: docker
    directories:
      - "/deploy"
      - "/deploy/caddy"
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      base-images:
        patterns: ["*"]
