# Optional overlay: a local speech-to-text server for the Ask screen's microphone, reachable ONLY by kidney-health.
# Specs: docs/dev/plans/assistant-step2.md (part B) and docs/ai.md "Voice input". Requires an app version with voice
# (assistant step 2, part B). The app never runs a speech model itself and never uses the browser's speech
# recognition (Chrome sends that audio to Google, Safari to Apple): a recording goes from the page to the app and from
# the app to this container, is turned into text and deleted. Nothing is stored.
#
#   podman-compose -f deploy/compose.yaml -f deploy/compose.stt-whisper.yaml up -d
#   docker compose  -f deploy/compose.yaml -f deploy/compose.stt-whisper.yaml up -d
#
# Then, as an admin: Server administration -> AI providers -> Speech to text -> "Test transcription", and switch on
# Server settings -> Optional AI -> "Voice input for Ask" (it stays off until you do). Each person agrees on first use.
#
# THE CONTAINER MUST NOT REACH THE INTERNET WHILE IT RUNS. It sits on an `internal` network shared only with
# kidney-health: no published port, no LAN exposure, no route out. Because that network has no egress, put the model
# in the volume ONCE, before the first start, with a throw-away container on a network that does have egress:
#
#   podman volume create kidney-health_stt-models
#   podman run --rm -v kidney-health_stt-models:/home/ubuntu/.cache/huggingface/hub \
#     --entrypoint python <the image: line below> \
#     -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-small')"
#
# (Docker: the same with `docker`; the volume is <project>_stt-models. The cache path and the entrypoint belong to the
# image: check them with `podman run --rm <image> env | grep HF_` and the image's own documentation for the pinned
# version.) STT_MODEL below must name the model you downloaded. After this step the running container needs no network
# at all, and HF_HUB_OFFLINE keeps it from trying: if it ever tries, something is wrong.
#
# The image is pinned by DIGEST, never by a tag alone. This file ships with a clearly marked placeholder because the
# digest could not be verified from where it was written: replace `<pin-the-digest-you-verified>` with the digest of the
# exact tag you pulled and checked (the release page names the tag; `crane digest <image>:<tag>` or `podman image
# inspect --format '{{.Digest}}' <image>:<tag>` prints it; compare it with the registry page). The overlay will not start
# with the placeholder. Dependabot does not read compose files, so bump the pin by hand, and keep this overlay out of
# CI's `compose config` lint until it is a real digest.
#
# Using the Ollama overlay too? Compose keeps only the last file's value of AI_PRIVATE_HOSTS: list both hosts in this
# line (AI_PRIVATE_HOSTS: ollama:11434,stt:8000) and give this file last.
#
# Never mount podman.sock or docker.sock into this or any other container (docs/security.md).
services:
  kidney-health:
    environment:
      STT_BASE_URL: http://stt:8000/v1      # the app adds /audio/transcriptions: http://stt:8000/v1/audio/transcriptions
      STT_MODEL: Systran/faster-whisper-small   # the model in the volume; a smaller or larger one changes speed and accuracy
      # The same SSRF policy as an AI provider: a private address is reachable only when listed here (env-only, no wildcards).
      AI_PRIVATE_HOSTS: stt:8000
      # Optional: STT_TIMEOUT_S (60), STT_DAILY_LIMIT per person (100, 0 = unlimited), STT_MAX_AUDIO_BYTES (1.5 MiB).
      # An optional key for a server that wants one is a FILE secret, like SECRET_KEY: STT_API_KEY_FILE=/run/secrets/stt_api_key
    networks:
      - default
      - stt

  stt:
    # Speaches (an OpenAI-compatible /v1/audio/transcriptions server on faster-whisper; CPU build). The tag is only
    # the human-readable name of the pin; the digest is what is pulled. Verify the tag exists and pick the current one.
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:<pin-the-digest-you-verified>
    container_name: kidney-health-stt
    restart: always
    environment:
      HF_HUB_OFFLINE: "1"                    # the model is in the volume; never download at run time
      ENABLE_UI: "false"                     # no web UI: the app is the only client
      LOG_LEVEL: warning
    volumes:
      - stt-models:/home/ubuntu/.cache/huggingface/hub:ro   # the model, read-only while running
    # Hardening, as for every other container here (docs/security.md): an unprivileged user, a read-only root
    # filesystem, no capabilities, no privilege gain, and limits so one runaway request cannot starve the host.
    user: "1000:1000"                        # the image's own non-root user ("ubuntu"); the model files belong to it
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512                          # inference threads count here; raise it only if the container reports it is out
    mem_limit: 3g                            # the small model needs about 1 GB; size it to the model
    cpus: "4"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # No `ports:`. Only kidney-health can reach it, over the internal network below.
    networks:
      - stt

networks:
  default: {}                                # declared so podman-compose accepts `default` above
  stt:
    internal: true                           # no route out: the model is put in the volume beforehand (see above)

volumes:
  stt-models: {}
