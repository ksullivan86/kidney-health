apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kidney-health
  namespace: kidney-health
  labels:
    app.kubernetes.io/name: kidney-health
  annotations:
    # --- TLS via cert-manager (uncomment together with spec.tls below) ---
    # cert-manager.io/cluster-issuer: letsencrypt-prod      # or your internal CA ClusterIssuer
    #
    # --- Authelia forward-auth with ingress-nginx (alternative to APP_PASSWORD) ---
    # nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local/api/authz/forward-auth"
    # nginx.ingress.kubernetes.io/auth-signin: "https://auth.home.example?rm=$request_method"
    # nginx.ingress.kubernetes.io/auth-response-headers: "Remote-User,Remote-Groups,Remote-Email,Remote-Name"
    # nginx.ingress.kubernetes.io/auth-snippet: |
    #   proxy_set_header X-Forwarded-Method $request_method;
    #
    # --- Plain nginx Basic auth instead (htpasswd Secret "kidney-health-htpasswd") ---
    # nginx.ingress.kubernetes.io/auth-type: basic
    # nginx.ingress.kubernetes.io/auth-secret: kidney-health-htpasswd
    # nginx.ingress.kubernetes.io/auth-realm: "Kidney Health"
spec:
  ingressClassName: nginx
  rules:
    - host: kidney.home.example          # <-- change to your hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kidney-health
                port:
                  name: http
  # tls:
  #   - hosts:
  #       - kidney.home.example
  #     secretName: kidney-health-tls    # created by cert-manager from the annotation above
