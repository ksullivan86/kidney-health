# OPTIONAL Gateway API alternative to ingress.yaml (Cilium Gateway, Envoy Gateway,
# Traefik v3, NGINX Gateway Fabric ...). Not listed in kustomization.yaml: either
# add it there and remove ingress.yaml, or `kubectl apply -f` it by hand after
# pointing parentRefs at your Gateway. Requires the Gateway API CRDs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kidney-health
  namespace: kidney-health
  labels:
    app.kubernetes.io/name: kidney-health
spec:
  parentRefs:
    - name: home-gateway               # <-- your Gateway's name
      namespace: gateway-system        # <-- and namespace (the Gateway must allow routes from kidney-health)
      # sectionName: https             # listener name, if the Gateway has several
  hostnames:
    - kidney.home.example              # <-- change to your hostname
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kidney-health
          port: 80
