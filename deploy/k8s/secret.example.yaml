# The Secret the Deployment mounts as FILES under /run/secrets/kidney-health (never envFrom).
# NOT applied by kustomization.yaml: never commit real values. Create it directly instead:
#   kubectl -n kidney-health create secret generic kidney-health \
#     --from-literal=secret_key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" \
#     --from-literal=usda_api_key=''
# Both keys must exist (the app reads both files); an empty usda_api_key means "USDA search off".
# Optional extra keys (add the matching *_FILE env var in deployment.yaml):
#   admin_password       with ADMIN_USERNAME + ADMIN_PASSWORD_FILE: create the first admin (GitOps)
#   proxy_secret         with AUTH_MODE=proxy: TRUSTED_PROXY_SECRET_FILE (docs/security.md)
#   ai_api_key           with a cloud AI_PROVIDER: AI_API_KEY_FILE (docs/ai.md)
# Talos encrypts Secrets in etcd (secretbox) by default since 1.3. Keep a copy of secret_key in
# your password manager: without it, stored API keys cannot be decrypted after a restore.
# After a change: kubectl -n kidney-health rollout restart deploy/kidney-health
apiVersion: v1
kind: Secret
metadata:
  name: kidney-health
  namespace: kidney-health
  labels:
    app.kubernetes.io/name: kidney-health
type: Opaque
stringData:
  secret_key: "REPLACE-with-at-least-32-random-characters"
  usda_api_key: ""     # https://fdc.nal.usda.gov/api-key-signup ; empty disables USDA search
