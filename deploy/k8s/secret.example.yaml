# Optional Secret for USDA_API_KEY and APP_PASSWORD (both may be empty / omitted).
# NOT applied by kustomization.yaml. Either:
#   kubectl -n kidney-health create secret generic kidney-health \
#     --from-literal=USDA_API_KEY='your-key' --from-literal=APP_PASSWORD='a long passphrase'
# or copy this file outside the repo, fill it in and `kubectl apply -f` it.
# Rotate with `kubectl -n kidney-health rollout restart deploy/kidney-health` afterwards.
apiVersion: v1
kind: Secret
metadata:
  name: kidney-health
  namespace: kidney-health
  labels:
    app.kubernetes.io/name: kidney-health
type: Opaque
stringData:
  USDA_API_KEY: ""     # https://fdc.nal.usda.gov/api-key-signup ; empty disables USDA search
  APP_PASSWORD: ""     # empty disables HTTP Basic auth (use Authelia / ingress auth instead)
