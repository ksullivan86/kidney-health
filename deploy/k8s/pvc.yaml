apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kidney-health-data
  namespace: kidney-health
  labels:
    app.kubernetes.io/name: kidney-health
spec:
  accessModes:
    - ReadWriteOnce            # SQLite: one writer, one pod (see Recreate strategy)
  resources:
    requests:
      storage: 1Gi             # the database is a few MB; 1Gi leaves room for backups
  # Leave storageClassName unset to use the cluster default (`kubectl get sc` shows it),
  # or pick the one you run on Talos. Names below are the upstream defaults; yours may differ.
  # storageClassName: local-path        # rancher/local-path-provisioner: hostPath on one node; set nodeSelector in deployment.yaml
  # storageClassName: longhorn          # Longhorn: replicated; Talos needs the iscsi-tools + util-linux-tools system extensions
  # storageClassName: rook-ceph-block   # Rook-Ceph RBD: replicated; the name is whatever your CephBlockPool StorageClass is called
  # storageClassName: mayastor-1        # OpenEBS Mayastor: create a StorageClass (repl=1 or 3) and use its name
  # storageClassName: openebs-hostpath  # OpenEBS LocalPV hostpath: like local-path
  # storageClassName: nfs-csi           # csi-driver-nfs: works, but SQLite over NFS is discouraged (locking)
