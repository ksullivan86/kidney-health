# kidney-health Deployment, hardened for Pod Security "restricted" and a read-only root filesystem.
# Spec: docs/dev/research/01-rootless-and-security.md §3.5, §5.3 and §10. Guide: docs/deployment.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kidney-health
  namespace: kidney-health
  labels:
    app.kubernetes.io/name: kidney-health
spec:
  # SQLite on a ReadWriteOnce volume: never more than one replica.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # Recreate, not RollingUpdate: the old pod must release the volume and the SQLite lock first.
    # No PodDisruptionBudget on purpose: with one replica it would block every node drain.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kidney-health
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kidney-health
    spec:
      # No Kubernetes API access from the pod, and no env vars about other Services.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Optional, Kubernetes >= 1.36 (GA): run the pod in its own user namespace. Needs Linux >= 6.3,
      # idmap-capable volumes (ext4, xfs, btrfs, tmpfs; not NFS), containerd >= 2.0 and, on Talos,
      # a SysctlConfig with user.max_user_namespaces (docs/deployment.md).
      # hostUsers: false
      # Pin to one node when using a hostPath-style StorageClass (local-path):
      # nodeSelector:
      #   kubernetes.io/hostname: talos-worker-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001            # USER in deploy/Containerfile; never 0
        runAsGroup: 10001
        fsGroup: 10001              # the volume and the secret files become group 10001
        fsGroupChangePolicy: OnRootMismatch
        # Ignore group memberships from the image's /etc/group (beta, on by default since 1.33;
        # needs containerd >= 2.0, which Talos ships). Remove it if the kubelet rejects the pod.
        supplementalGroupsPolicy: Strict
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # The tag and digest are set in kustomization.yaml (`images:`).
          image: ghcr.io/ksullivan86/kidney-health:0.22
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATA_DIR
              value: /data
            # Secrets are files, not env vars (secret.example.yaml).
            - name: SECRET_KEY_FILE
              value: /run/secrets/kidney-health/secret_key
            - name: USDA_API_KEY_FILE
              value: /run/secrets/kidney-health/usda_api_key
            # TRUSTED_PROXIES (whose X-Forwarded-For / -Proto to believe) and PUBLIC_URL (the URL
            # people type) depend on your cluster and host, so the base leaves them unset: the app
            # then trusts only loopback, which is safe but ignores your Gateway's X-Forwarded-Proto
            # (cookies without Secure, and sign-in refused over "plain HTTP" once two accounts exist).
            # Set both in your overlay (deploy/k8s-overlays/example/deployment-env.yaml; docs/security.md §4).
            # - name: AUTH_MODE
            #   value: local
            # v0.3 features (deploy/.env.example explains each): meal guidance is on, everything that contacts
            # the internet is OFF until switched on. The
            # egress each one needs is already allowed by networkpolicy.yaml (public HTTPS); with Cilium,
            # uncomment its host in cilium-networkpolicy.example.yaml. A value here LOCKS the setting in
            # Settings → Admin; without it an admin switches it in the app.
            # - name: OFF_ENABLED                 # world.openfoodfacts.org
            #   value: "true"
            # - name: OFF_CONTACT
            #   value: admin@example.net
            # - name: AI_ENABLED                  # plus AI_PROVIDER, AI_MODEL, ... (docs/ai.md)
            #   value: "true"
            # - name: AI_PROVIDER
            #   value: openai
            # - name: AI_MODEL
            #   value: gpt-6-luna
            # - name: AI_API_KEY_FILE             # add ai_api_key to the Secret (secret.example.yaml)
            #   value: /run/secrets/kidney-health/ai_api_key
            # A LAN AI server (Ollama, Hermes): AI_BASE_URL, AI_PRIVATE_HOSTS=<host:port>, and its own egress
            # rule (the commented ipBlock example in networkpolicy.yaml).
            # A cloud AI as well as the local one, both from the environment (docs/ai.md): give the AI_PROVIDER above
            # AI_PROVIDER_ROLE=local, then AI_CLOUD_PROVIDER (always the cloud AI), AI_CLOUD_BASE_URL, AI_CLOUD_MODEL, its key as
            # AI_CLOUD_API_KEY_FILE=/run/secrets/kidney-health/ai_cloud_api_key (add ai_cloud_api_key to the Secret), and
            # AI_CLOUD_UPSTREAM=<the company a LiteLLM proxy forwards to> when the preset is a server you run.
            # The reports scripts/ai_eval.py writes (docs/ai.md "How well each AI is doing"): mount them read-only, e.g. a
            # ConfigMap or a PersistentVolumeClaim named ai-eval (add the volumeMount and volume below), and set
            # - name: AI_EVAL_REPORTS_DIR
            #   value: /ai-eval
            # - name: ASSISTANT_ENABLED           # personal tokens for a chat assistant (docs/assistant.md); a token
            #   value: "true"                     # reads, and with "Can also save food and recipes" also saves
            # - name: PUSH_ENABLED                # device tokens for an iPhone Shortcut (docs/push.md): a token can only
            #   value: "true"                     # add weights and blood pressure readings (POST /push/v1/body)
            # - name: SHARING_ENABLED             # read-only sharing with someone else who has an account here
            #   value: "true"                     # (docs/accounts.md): they can read, never change
            # - name: SETTINGS_INITIAL_ONLY       # these variables are first values, not locks: written once,
            #   value: "SHARING_ENABLED"          # then changeable in the app (docs/deployment.md); * for all
            # - name: AUTH_REQUIRE_TWO_STEP_ADMINS  # admins must use two-step sign-in to open Server
            #   value: "true"                     # administration (docs/accounts.md)
            # - name: OIDC_ENABLED                # sign in with Authentik, Google or another OpenID Connect provider
            #   value: "true"                     # (docs/accounts.md); needs PUBLIC_URL, OIDC_ISSUER, OIDC_CLIENT_ID
            # - name: OIDC_CLIENT_SECRET_FILE     # the client secret, from the Secret (add oidc_client_secret there)
            #   value: /run/secrets/kidney-health/oidc_client_secret
            # Or Authentik and Google together (docs/accounts.md); each provider's return address is
            # <PUBLIC_URL>/api/auth/oidc/callback/<name>, and each secret is a key of the Secret:
            # - name: OIDC_PROVIDERS
            #   value: "authentik,google"
            # - name: OIDC_AUTHENTIK_ISSUER
            #   value: https://auth.example.org/application/o/kidney-health/
            # - name: OIDC_AUTHENTIK_CLIENT_ID
            #   value: your-authentik-client-id
            # - name: OIDC_AUTHENTIK_CLIENT_SECRET_FILE
            #   value: /run/secrets/kidney-health/oidc_authentik_secret
            # - name: OIDC_AUTHENTIK_ALLOW_PRIVATE_ISSUER
            #   value: "true"
            # - name: OIDC_GOOGLE_ISSUER
            #   value: https://accounts.google.com
            # - name: OIDC_GOOGLE_CLIENT_ID
            #   value: your-google-client-id.apps.googleusercontent.com
            # - name: OIDC_GOOGLE_CLIENT_SECRET_FILE
            #   value: /run/secrets/kidney-health/oidc_google_secret
            # - name: OIDC_GOOGLE_ALLOWED_DOMAINS
            #   value: example.org
            # - name: OIDC_ONLY                   # no passwords: only the providers and passkeys (link your admin first)
            #   value: "true"
            # - name: TOKENS_ALLOW_NEVER_EXPIRING # false: every new token expires (30, 90 or 365 days)
            #   value: "false"
            # - name: DEVICES_ENABLED             # each person's own Withings scale or blood pressure monitor
            #   value: "true"                     # (docs/devices.md); needs PUBLIC_URL and the three WITHINGS_ variables
            # - name: WITHINGS_ENABLED
            #   value: "true"
            # - name: WITHINGS_CLIENT_ID
            #   value: your-withings-client-id
            # - name: WITHINGS_CLIENT_SECRET_FILE # from the Secret (add withings_client_secret there)
            #   value: /run/secrets/kidney-health/withings_client_secret
            # - name: WHOOP_ENABLED               # each person's own Whoop strap (docs/devices.md)
            #   value: "true"
            # - name: WHOOP_CLIENT_ID
            #   value: your-whoop-client-id
            # - name: WHOOP_CLIENT_SECRET_FILE    # from the Secret (add whoop_client_secret there)
            #   value: /run/secrets/kidney-health/whoop_client_secret
            # - name: LIST_SYNC_ENABLED           # each person's own Grocy, KitchenOwl or Mealie (docs/list-sync.md)
            #   value: "true"
            # - name: LIST_SYNC_ALLOWED_HOSTS     # a list app on a private address; also allow it in networkpolicy.yaml
            #   value: grocy.home.svc.cluster.local,10.0.0.0/8
            # - name: RECIPE_IMPORT_ENABLED       # read a recipe page a person pastes (docs/recipe-import.md)
            #   value: "true"
            # - name: INSTACART_ENABLED           # open the shopping list at Instacart (docs/instacart.md)
            #   value: "true"
            # - name: INSTACART_API_KEY_FILE      # from the Secret (add instacart_api_key there)
            #   value: /run/secrets/kidney-health/instacart_api_key
            # - name: INSTACART_BASE_URL          # the development host while the production key waits for approval
            #   value: https://connect.dev.instacart.tools
            # - name: TEST_ACCOUNT_ENABLED        # tester and tester-helper for people who test the app
            #   value: "true"                     # (docs/test-the-full-app.md); never admins
            # - name: TEST_ACCOUNT_PASSWORD_FILE  # their one password, from the Secret (add test_account_password there)
            #   value: /run/secrets/kidney-health/test_account_password
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/kidney-health
              readOnly: true
            # - name: ai-eval                     # the ai_eval reports, read-only (AI_EVAL_REPORTS_DIR above)
            #   mountPath: /ai-eval
            #   readOnly: true
          # Probes come from the node's kubelet, which NetworkPolicy cannot block. The pod IP in
          # the Host header is an IP literal, which the Host allowlist always accepts.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              # No CPU limit on purpose: it only causes throttling for a bursty single user.
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # the app writes only /data and /tmp
            runAsNonRoot: true
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kidney-health-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: secrets
          secret:
            secretName: kidney-health
            # Group-readable: the files belong to group fsGroup (10001), never world-readable.
            defaultMode: 0440
            # The pod starts without the Secret, but then SECRET_KEY_FILE points at a missing file
            # and the app refuses to start with a clear message: create the Secret first.
            optional: true
        # - name: ai-eval
        #   configMap:                          # up to 1 MiB in all; use a persistentVolumeClaim for more
        #     name: kidney-ai-eval              # kubectl create configmap kidney-ai-eval --from-file=<report>.json
