# kidney-health Deployment, hardened for Pod Security "restricted" and a read-only root filesystem.
# Spec: docs/dev/research/01-rootless-and-security.md §3.5, §5.3 and §10. Guide: docs/deployment.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kidney-health
  namespace: kidney-health
  labels:
    app.kubernetes.io/name: kidney-health
spec:
  # SQLite on a ReadWriteOnce volume: never more than one replica.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # Recreate, not RollingUpdate: the old pod must release the volume and the SQLite lock first.
    # No PodDisruptionBudget on purpose: with one replica it would block every node drain.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kidney-health
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kidney-health
    spec:
      # No Kubernetes API access from the pod, and no env vars about other Services.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Optional, Kubernetes >= 1.36 (GA): run the pod in its own user namespace. Needs Linux >= 6.3,
      # idmap-capable volumes (ext4, xfs, btrfs, tmpfs; not NFS), containerd >= 2.0 and, on Talos,
      # a SysctlConfig with user.max_user_namespaces (docs/deployment.md).
      # hostUsers: false
      # Pin to one node when using a hostPath-style StorageClass (local-path):
      # nodeSelector:
      #   kubernetes.io/hostname: talos-worker-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001            # USER in deploy/Containerfile; never 0
        runAsGroup: 10001
        fsGroup: 10001              # the volume and the secret files become group 10001
        fsGroupChangePolicy: OnRootMismatch
        # Ignore group memberships from the image's /etc/group (beta, on by default since 1.33;
        # needs containerd >= 2.0, which Talos ships). Remove it if the kubelet rejects the pod.
        supplementalGroupsPolicy: Strict
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # The tag and digest are set in kustomization.yaml (`images:`).
          image: ghcr.io/ksullivan86/kidney-health:0.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATA_DIR
              value: /data
            # Secrets are files, not env vars (secret.example.yaml).
            - name: SECRET_KEY_FILE
              value: /run/secrets/kidney-health/secret_key
            - name: USDA_API_KEY_FILE
              value: /run/secrets/kidney-health/usda_api_key
            # TRUSTED_PROXIES (whose X-Forwarded-For / -Proto to believe) and PUBLIC_URL (the URL
            # people type) depend on your cluster and host, so the base leaves them unset: the app
            # then trusts only loopback, which is safe but ignores your Gateway's X-Forwarded-Proto
            # (cookies without Secure, and sign-in refused over "plain HTTP" once two accounts exist).
            # Set both in your overlay (deploy/k8s-overlays/example/deployment-env.yaml; docs/security.md §4).
            # - name: AUTH_MODE
            #   value: local
            # v0.3 features (deploy/.env.example explains each): meal guidance is on, everything that contacts
            # the internet is OFF until switched on. The
            # egress each one needs is already allowed by networkpolicy.yaml (public HTTPS); with Cilium,
            # uncomment its host in cilium-networkpolicy.example.yaml. A value here LOCKS the setting in
            # Settings → Admin; without it an admin switches it in the app.
            # - name: OFF_ENABLED                 # world.openfoodfacts.org
            #   value: "true"
            # - name: OFF_CONTACT
            #   value: admin@example.net
            # - name: AI_ENABLED                  # plus AI_PROVIDER, AI_MODEL, ... (docs/ai.md)
            #   value: "true"
            # - name: AI_PROVIDER
            #   value: openai
            # - name: AI_MODEL
            #   value: gpt-6-luna
            # - name: AI_API_KEY_FILE             # add ai_api_key to the Secret (secret.example.yaml)
            #   value: /run/secrets/kidney-health/ai_api_key
            # A LAN AI server (Ollama, Hermes): AI_BASE_URL, AI_PRIVATE_HOSTS=<host:port>, and its own egress
            # rule (the commented ipBlock example in networkpolicy.yaml).
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/kidney-health
              readOnly: true
          # Probes come from the node's kubelet, which NetworkPolicy cannot block. The pod IP in
          # the Host header is an IP literal, which the Host allowlist always accepts.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              # No CPU limit on purpose: it only causes throttling for a bursty single user.
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # the app writes only /data and /tmp
            runAsNonRoot: true
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kidney-health-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: secrets
          secret:
            secretName: kidney-health
            # Group-readable: the files belong to group fsGroup (10001), never world-readable.
            defaultMode: 0440
            # The pod starts without the Secret, but then SECRET_KEY_FILE points at a missing file
            # and the app refuses to start with a clear message: create the Secret first.
            optional: true
