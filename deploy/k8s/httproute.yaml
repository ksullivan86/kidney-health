# Gateway API route (the default way in; Cilium Gateway, Envoy Gateway, Traefik v3, NGINX Gateway
# Fabric, ...). Requires the Gateway API CRDs and a Gateway with an HTTPS listener (cert-manager
# can issue its certificate: docs/https.md, Kubernetes tier). ingress-nginx was retired upstream in
# March 2026; ingress.example.yaml remains only for other Ingress controllers.
# Edit parentRefs and hostnames, set PUBLIC_URL in deployment.yaml to the same host, and make
# networkpolicy.yaml allow the Gateway's namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kidney-health
  namespace: kidney-health
  labels:
    app.kubernetes.io/name: kidney-health
spec:
  parentRefs:
    - name: home-gateway               # <-- your Gateway's name
      namespace: gateway-system        # <-- and namespace (it must allow routes from kidney-health)
      sectionName: https               # <-- the HTTPS listener; never route the app over plain HTTP
  hostnames:
    # Use a neutral name: the certificate's host name is published in Certificate Transparency logs.
    - food.home.example.net            # <-- your host name
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kidney-health
          port: 80
