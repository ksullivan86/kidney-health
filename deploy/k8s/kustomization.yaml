# kubectl apply -k deploy/k8s        (or: kustomize build deploy/k8s | kubectl apply -f -)
# Guide: docs/deployment.md (Kubernetes / Talos). Before applying, edit:
#   httproute.yaml       parentRefs + hostnames (or use ingress.example.yaml instead)
#   networkpolicy.yaml   the namespace of your Gateway / ingress controller
#   deployment.yaml      TRUSTED_PROXIES and PUBLIC_URL
#   pvc.yaml             storageClassName for your cluster (or leave the default class)
# and create the Secret first (secret.example.yaml shows the command).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kidney-health
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - httproute.yaml
  # Not included on purpose: secret.example.yaml (never commit secrets),
  # ingress.example.yaml (Ingress instead of HTTPRoute), cilium-networkpolicy.example.yaml (Cilium),
  # restore-pod.example.yaml (one-off, for restoring a backup; docs/deployment.md).
images:
  # Pin the release you verified, by tag AND digest (the digest wins; the tag is for humans):
  #   scripts/verify-image.sh 0.3.0        prints the verified digest, then:
  #   kustomize edit set image ghcr.io/ksullivan86/kidney-health=ghcr.io/ksullivan86/kidney-health:0.3.0@sha256:<digest>
  # Never :latest or :edge here.
  - name: ghcr.io/ksullivan86/kidney-health
    newTag: "0.3"
    # digest: sha256:<verified digest>
