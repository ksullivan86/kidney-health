# The cluster-neutral base: it renders unchanged on any cluster and holds no cluster-specific value
# (no pod CIDR, Gateway, host name or storage class). Do not edit it; apply an overlay that adds them:
#   cp -r deploy/k8s-overlays/example deploy/k8s-overlays/home   # then edit the files it lists
#   kubectl apply -k deploy/k8s-overlays/home
# From a separate GitOps repository, use this base remotely in your own kustomization.yaml:
#   resources: [https://github.com/ksullivan86/kidney-health//deploy/k8s?ref=v0.3.1]
# Applied alone, the base starts the app but lets no traffic in (the NetworkPolicy allows no ingress
# until the overlay names your Gateway's namespace). Guide: docs/deployment.md (Kubernetes / Talos).
# Create the Secret first (secret.example.yaml shows the command).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kidney-health
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  # Not included on purpose: the HTTPRoute (it names your Gateway and host: deploy/k8s-overlays/example/),
  # secret.example.yaml (never commit secrets), ingress.example.yaml (Ingress instead of HTTPRoute),
  # cilium-networkpolicy.example.yaml (Cilium), restore-pod.example.yaml (one-off, for restoring a
  # backup; docs/deployment.md).
images:
  # The base tracks the minor release. Pin the release you verified in your overlay, by tag AND
  # digest (the digest wins; the tag is for humans; each GitHub release's notes carry it):
  #   scripts/verify-image.sh 0.3.0        prints the verified digest, then, in the overlay directory:
  #   kustomize edit set image ghcr.io/ksullivan86/kidney-health=ghcr.io/ksullivan86/kidney-health:0.3.0@sha256:<digest>
  # Never :latest or :edge here.
  - name: ghcr.io/ksullivan86/kidney-health
    newTag: "0.3"
    # digest: sha256:<verified digest>
