# hadolint configuration for deploy/Containerfile and deploy/Containerfile.debian
# (docs/dev/research/01-rootless-and-security.md §5.4).
#   local: hadolint deploy/Containerfile deploy/Containerfile.debian      (from the repository root)
#   CI:    .github/workflows/ci.yml, job "lint": the hadolint release binary, SHA-256 checked
#
# Fail on warnings and errors; info/style findings are reported but do not fail.
failure-threshold: warning

# Nothing is ignored globally. The only exception is inline and explained where it is used:
#   DL3002 (last USER is root) in the throw-away builder and handbook stages of deploy/Containerfile,
#          which must run as root to create /opt/venv and /opt/hb; the runtime stage ends with
#          USER 10001:10001.
# Rules that might look relevant but are satisfied:
#   DL3013 (pin pip versions)    pip installs only from the hash-locked requirements.lock and
#                                handbook/requirements.lock.
#   DL3042 (pip --no-cache-dir)  set on every pip call (and PIP_NO_CACHE_DIR=1).
#   DL3007 (:latest)             every FROM carries an @sha256 digest, which is what pins it.
#   DL3008 / DL3015 (apt pins)   no apt or apk packages are installed.
ignored: []

# DL3026: FROM must come from one of these registries.
#   cgr.dev    Chainguard python:latest-dev / :latest (the published image, deploy/Containerfile)
#   docker.io  python:3.14-slim-trixie (the Debian fallback, deploy/Containerfile.debian)
#   ghcr.io    our own image (debug and derived builds)
trustedRegistries:
  - cgr.dev
  - docker.io
  - ghcr.io

# DL3049-DL3054: the OCI labels we rely on must be present and well formed. The licence label is an
# SPDX expression, "PolyForm-Noncommercial-1.0.0 AND CC-BY-NC-SA-4.0" (the code and the handbook text
# in /app/learn), which hadolint's `spdx` check cannot parse (it accepts single identifiers only), so
# it is `text` here and tests/test_deploy.py pins its exact value instead.
label-schema:
  org.opencontainers.image.title: text
  org.opencontainers.image.description: text
  org.opencontainers.image.source: url
  org.opencontainers.image.url: url
  org.opencontainers.image.documentation: url
  org.opencontainers.image.licenses: text
strict-labels: false
