[project]
name = "kidney-health"
version = "0.5.0"
description = "Self-hosted food log with renal-diet and type 1 diabetes nutrient warnings"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.11"
# Direct runtime dependencies; the exact, hash-pinned set is requirements.lock (scripts/lock.sh).
dependencies = [
  "fastapi>=0.142,<1",
  "uvicorn>=0.54,<1",
  "h11>=0.16.0",
  "pydantic>=2.13,<3",
  "httpx2>=2.13,<3",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "safety: health-data safety rules that must travel with any reused piece (CLAUDE.md): no dosing, never block or warn against treating a low, quoted handbook text, AI guard and prefilter",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
"app.auth" = ["password-blocklist.txt.gz"]

# CI runs `ruff check .` (the lint job pins the ruff release). ruff 0.17 widened its default rule set to
# about 400 rules; the rules below are the older default (pycodestyle errors and pyflakes), kept explicit
# so a ruff upgrade never changes what CI checks. Widen them in a pull request of their own.
# target-version is read from requires-python (>=3.11), the oldest Python a source install may use.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
