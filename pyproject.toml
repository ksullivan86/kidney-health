[project]
name = "kidney-health"
version = "0.3.0.dev0"
description = "Self-hosted food log with renal-diet and type 1 diabetes nutrient warnings"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.11"
# Direct runtime dependencies; the exact, hash-pinned set is requirements.lock (scripts/lock.sh).
dependencies = [
  "fastapi>=0.142,<1",
  "uvicorn>=0.54,<1",
  "h11>=0.16.0",
  "pydantic>=2.13,<3",
  "httpx2>=2.13,<3",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
"app.auth" = ["password-blocklist.txt.gz"]
