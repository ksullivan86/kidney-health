  - id: transplant
    short_title: After a kidney transplant
    title: "7-day sample menu: after a kidney transplant"
    description: "A week of meals after a kidney transplant with type 1 diabetes: protein 56–70 g, sodium under 2,000 mg, food-safety choices and no grapefruit."
    applies_to: [Tx]
    targets_row: {stage: "1", dialysis: none}       # the app has no transplant row; a working transplant uses the stage 1–2 starting points
    targets_label: "after a transplant (the stage 1–2 starting points)"
    carbs_per_meal_g: 55
    carb_tolerance_g: 5
    snack_carbs_g: [10, 30]
    energy_kcal: [1750, 2450]
    potassium_limit: false                          # unless labs run high: tacrolimus can raise potassium
    phosphorus_limit: false
    rules: [no_phosphate_additive, no_grapefruit, transplant_food_safety]
    sources: [FDC, K09TX, K24, FSTX, FOODSAFE, FSTEMPS, FDAgrapefruit, PROGRAF, A26-5, DG7]
    intro: >-
      With a working transplant, most people no longer need the strict kidney diet. KDIGO asks transplant
      recipients to follow a healthy lifestyle with a proper diet, and your transplant team sets your own
      numbers. This week uses the app's stage 1–2 starting points: 56–70 g of protein for a 70 kg adult and
      sodium under 2,000 mg. Three things are different after a transplant. **Food safety:** anti-rejection
      medicines weaken the immune system, so every meat, fish and egg is cooked through and there is no
      deli meat or smoked fish. **No grapefruit or its relatives,** which change the blood level of some
      anti-rejection medicines. **Glucose:** steroids and tacrolimus can raise it, so carbohydrate stays
      at about 55 g a meal and your team adjusts insulin. Potassium is shown because tacrolimus can raise
      it; follow your blood tests.
    swaps:
      - "**Fruit:** any fruit except grapefruit, pomelo, Seville orange and tangelo. Oranges, clementines, berries, apples, pears and canned fruit in juice are all fine."
      - "**Protein foods:** chicken, turkey, pork, beef, fish and eggs swap ounce for ounce, always cooked to a safe temperature (poultry 165 °F, fish and whole cuts 145 °F)."
      - "**Cheese:** hard cheese such as cheddar is fine. Soft cheeses are safe only if the label says they are made from pasteurized milk."
      - "**Grains:** whole-wheat bread, brown rice and oatmeal swap with their white versions at the same carbohydrate."
    make_it_yours:
      - "**Scale for your weight.** Protein here is 0.8–1.0 g per kg for 70 kg: 48–60 g a day at 60 kg and 64–80 g at 80 kg. Ask your transplant dietitian which weight and range to use."
      - "**If your potassium runs high,** your team may ask you to limit it; the [stage 3 menu](g3.md) shows lower-potassium days."
      - "**Glucose changes after a transplant.** Steroids and tacrolimus can raise glucose. Check as your team asks and report highs and lows; never change insulin on your own."
      - *carbs
      - *lows
      - *energy
      - *seasoning
      - *log
    source_lines:
      - *src_fdc
      - "[KDIGO 2009 transplant recipient guideline][K09TX]: a healthy lifestyle with exercise and a proper diet (Rec 26)."
      - "[KDIGO 2024 CKD guideline][K24]: sodium under 2 g a day (Rec 3.3.2.1)."
      - "[USDA–FDA: food safety for transplant recipients][FSTX], [FoodSafety.gov: weakened immune systems][FOODSAFE] and [FoodSafety.gov: safe minimum internal temperatures][FSTEMPS]: deli meats, smoked fish and raw shellfish; safe cooking temperatures."
      - "[FDA: grapefruit juice and some drugs don't mix][FDAgrapefruit]; [Prograf (tacrolimus) label][PROGRAF]: avoid grapefruit; tacrolimus can raise glucose and potassium."
      - *src_a5
      - *src_dg7
