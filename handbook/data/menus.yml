  - id: peritoneal
    short_title: Peritoneal dialysis
    title: "7-day sample menu: peritoneal dialysis"
    description: "A week of meals for peritoneal dialysis with type 1 diabetes: 70–84 g protein, potassium under 3,500 mg, fluid under 2,000 mL, a little less food energy because of dialysate glucose."
    applies_to: [PD]
    targets_row: {stage: "5", dialysis: peritoneal}
    carbs_per_meal_g: 50
    carb_tolerance_g: 5
    snack_carbs_g: [10, 30]
    energy_kcal: [1500, 2050]                      # 30 kcal/kg minus about 400 kcal absorbed from the dialysate, ± range
    rules: [no_phosphate_additive]
    sources: [FDC, Q20, K24, A26-11, A26-5, DG7, DG25a, DG6]
    intro: >-
      Peritoneal dialysis runs every day, so potassium is usually less strict than on hemodialysis
      (under 3,500 mg here, and some people on PD run low and need more), while protein goes **up** to
      70–84 g a day for 70 kg because protein is lost into the dialysis fluid. The glucose in the
      dialysis fluid adds calories (often 400 or more a day) and raises blood glucose, so food energy
      here is lower (about 1,700 kcal) and carbohydrate is about 50 g per main meal. Fluid stays under
      2,000 mL including foods that are liquid at room temperature.
    swaps:
      - "**More potassium is often allowed on PD:** a small orange (about 240 mg), two thin tomato slices (under 100 mg) or a leached potato fit on most days. Follow your own blood results."
      - "**Protein foods:** chicken, turkey, pork loin, cod, salmon, pot roast and firm tofu all work; keep the portions even on days you are not hungry, because protein is lost into the fluid every day."
      - "**Fruit:** any ½ cup from the low-potassium list can replace another; check the carbohydrate."
    make_it_yours:
      - "**Scale for your weight.** Protein here is 1.0–1.2 g per kg for 70 kg: 60–72 g a day at 60 kg and 80–96 g at 80 kg. Change the meat by about ¾ oz at lunch and dinner for each 5 kg."
      - "**Dialysate glucose changes your numbers:** stronger bags add more glucose and calories. Your team adjusts insulin and may change the food plan when your prescription changes."
      - "**Use a glucose-specific meter** if you use icodextrin (Extraneal): some meters read falsely high ([Peritoneal dialysis](../../stages/peritoneal-dialysis.md))."
      - *carbs
      - *lows
      - *log
    source_lines:
      - *src_fdc
      - *src_q20
      - *src_k24
      - *src_a11
      - *src_a5
      - *src_dg7
      - "[DaVita: peritoneal dialysis diet][DG25a]: potassium 3,000–4,000 mg a day; 400 or more kcal a day from the dialysate."
      - "[Bethke and Jansky 2008][DG6]: boiling small pieces of potato removes about half its potassium."
    days:
      - name: "Day 1"
        note: "The dialysis fluid adds calories and glucose that are not in these totals (often 400 kcal or more a day), so food energy and carbohydrate are a little lower than on the other menus."
