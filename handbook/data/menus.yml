  - id: hemodialysis
    short_title: In-centre hemodialysis
    title: "7-day sample menu: in-centre hemodialysis"
    description: "A week of meals for hemodialysis three times a week with type 1 diabetes: 70–84 g protein, potassium under 2,500 mg, fluid under 1,500 mL including foods."
    applies_to: [HD, HHD]
    targets_row: {stage: "5", dialysis: hemodialysis}
    carbs_per_meal_g: 55
    carb_tolerance_g: 5
    snack_carbs_g: [10, 30]
    energy_kcal: [1750, 2450]
    rules: [no_phosphate_additive]
    dialysis_days: true
    sources: [FDC, Q20, K24, A26-11, A26-5, DG7, DG23, DG19a, DG53, DG28a]
    intro: >-
      On hemodialysis protein goes **up**, to 70–84 g a day for 70 kg (1.0–1.2 g per kg), because
      dialysis removes protein and too little causes muscle loss. Potassium stays under 2,500 mg,
      phosphorus under 1,000 mg and sodium well under 2,000 mg, and fluid is counted: drinks plus foods
      that are liquid at room temperature (sherbet, gelatin, ice). The menus use about 450–850 mL of the
      1,500 mL starting allowance, which leaves room for drinks with medicines and on hot days. Days 1, 3
      and 5 are dialysis days (Monday, Wednesday, Friday). Saturday and Sunday fall in the long weekend gap,
      the riskiest time for high potassium and fluid overload, so those days stay at the low end.
    swaps:
      - "**Egg whites** are the lowest-phosphorus protein: about 3.6 g protein for 5 mg phosphorus each."
      - "**Drinks:** water, tea or coffee can replace each other cup for cup; all of them count toward fluid, and so do ice chips, sherbet, gelatin and ice pops."
      - "**Protein foods:** chicken, turkey, pork loin, cod and pot roast swap ounce for ounce; salmon and tilapia have more potassium (about 330 mg per 3 oz)."
      - "**Fruit and vegetables:** stay with the low-potassium list in ½-cup portions on non-dialysis days, especially on Sunday."
    make_it_yours:
      - "**Scale for your weight.** Protein here is 1.0–1.2 g per kg for 70 kg. At 60 kg that is 60–72 g a day, at 80 kg 80–96 g: change the meat at lunch and dinner by about ¾ oz for each 5 kg. Use the weight your unit gives you (often your dry weight)."
      - "**Fluid is personal:** the 1,500 mL here assumes you still pass about 500 mL of urine a day. Your unit sets your allowance and checks it at every session."
      - *carbs
      - "**Lows on dialysis days:** glucose often drops during and after a session. Check before and after, carry glucose tablets (they add no fluid), and treat a low straight away ([Treating a low](../../t1d/treating-a-low.md)). Your team adjusts insulin for dialysis days."
      - *energy
      - *log
    source_lines:
      - *src_fdc
      - *src_q20
      - *src_k24
      - *src_a11
      - *src_a5
      - *src_dg7
      - "[DaVita: hemodialysis fluid intake][DG23] and [AKF Kidney Kitchen: fluids][DG19a]: about 1,000 mL a day plus your urine output."
      - "[Foley 2011][DG53]: the long gap between sessions carries the highest risk; [Cabrera 2015][DG28a]: weight gain between sessions above 3.5 % of body weight is linked to death."
    days:
      - name: "Day 1"
        label: "Monday, dialysis day"
        dialysis_day: true
        note: "Dialysis day. Pack the afternoon snack and glucose tablets for the session; check your glucose before and after dialysis. Take phosphate binders with meals and snacks the way your team prescribed. Monday's session ends the long weekend gap."
        meals:
          - meal: breakfast
            items:
              - {fdc_id: 171657, servings: 1, note: "cooked without salt"}  # Cream of wheat, cooked: 1 cup (251 g)
              - {fdc_id: 171711, servings: 1}  # Blueberries, raw: ½ cup (74 g)
              - {fdc_id: 172187, servings: 1}  # Egg, scrambled: 1 large (61 g)
              - {fdc_id: 172183, servings: 1, note: "scrambled with the egg"}  # Egg white, raw: 1 large (33 g)
              - {fdc_id: 174924, servings: 1, note: "toasted"}  # Bread, white: 1 slice (29 g)
              - {fdc_id: 173430, servings: 1, note: "unsalted"}  # Butter, unsalted: 1 tbsp (14 g)
              - {fdc_id: 171890, servings: 1}  # Coffee, brewed: 1 cup, 8 fl oz (237 g)
              - {fdc_id: 171255, servings: 1}  # Half and half: 1 tbsp (15 g)
          - meal: lunch
