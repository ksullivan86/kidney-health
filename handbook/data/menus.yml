    intro: >-
      This week is built for the stricter starting points used at stages 4 and 5 before dialysis:
      potassium under 2,500 mg, phosphorus under 900 mg, sodium well under 2,000 mg, and still about
      56 g of protein (0.8 g per kg for 70 kg), because with diabetes going lower risks muscle loss and
      lows. It uses refined grains, low-potassium fruit and vegetables in ½-cup portions, egg whites and
      no foods with phosphate additives. Carbohydrate stays at about 55 g per main meal. If your blood
      potassium and phosphate are normal, your team may allow more; ask before changing.
    swaps:
      - "**Egg whites for a whole egg:** each white has about 3.6 g protein and 5 mg phosphorus; a whole hard-boiled egg has 6.3 g protein and 86 mg phosphorus."
      - "**Fruit:** swap ½ cup for ½ cup within applesauce, blueberries, strawberries, raspberries, grapes, canned pears and canned peaches; check the carbohydrate."
      - "**Vegetables:** green beans, cauliflower, cabbage, cucumber, lettuce, onion and peppers swap freely at ½ cup."
      - "**Rice milk:** use only a brand without phosphate in the ingredient list; almond milk is lower in phosphorus but has more potassium and sodium."
    make_it_yours:
      - "**Scale for your weight.** Protein here is 0.8 g per kg for 70 kg: about 48 g a day at 60 kg and 64 g at 80 kg. Change the meat by about ½ oz at lunch and dinner for each 5 kg. Ask your dietitian which weight to use."
      - *carbs
      - *lows
      - *energy
      - *seasoning
      - *log
