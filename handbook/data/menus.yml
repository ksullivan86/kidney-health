# Sample menus for the handbook: 7 days per stage, built only from builtin foods in data/foods.json
# (by fdc_id and servings of the food's serving_desc), so every day can be logged in the app.
#
# scripts/build_handbook.py turns this file into handbook/docs/eat/menus/<id>.md, the overview table
# and handbook/docs/eat/grocery-lists.md, and fails (exit 1) unless every day:
#   * stays within the stage's targets from docs/research/targets_by_stage.json for the reference
#     person below (protein at least the minimum, with the ARCHITECTURE.md v0.3 diabetes floor of
#     0.8 g/kg before dialysis; potassium, phosphorus, sodium and fluid at most the ceiling);
#   * keeps energy inside energy_kcal;
#   * keeps carbohydrate at each main meal within carb_tolerance_g of carbs_per_meal_g (≤ 10 g) and each
#     snack inside snack_carbs_g (drinks-only snacks are exempt);
#   * uses no avoid_ckd food, no hypo_treatment food (rescue foods sit on top of a menu) and, with the
#     no_phosphate_additive rule, no phosphate_additive food.
# Print every day's totals with: python scripts/build_handbook.py --totals
#
# Editing a day: change fdc_id/servings, run --totals until every day says OK, then run the script
# without arguments to regenerate the pages. A `note` is shown next to the food name.

last_checked: 2026-10-05

reference_person:
  weight_kg: 70        # used as the reference ("ideal") weight: BMI 24.2 at 170 cm, so the app uses it as is
  height_cm: 170
  diabetes: type1

common:
  carbs: &carbs >-
    **Carbohydrate stays steady:** about the same amount at each main meal every day, so a fixed insulin
    plan or a carbohydrate ratio works the same way from day to day. Your own amount per meal comes from
    your diabetes team; keep it consistent and count what you actually eat
    ([Carb counting](../carb-counting.md)).
  lows: &lows >-
    **Lows come first.** Treat a low straight away with glucose tablets or another fast 15 g
    ([Treating a low](../../t1d/treating-a-low.md)), even if it adds potassium or fluid. Rescue foods
    are on top of these menus and are never "against the rules".
  log: &log >-
    **Log it in the app:** every food here is in the app's food list under the same name. Saved meals
    and "copy day" let you reuse a menu day ([Planning and menus](../../app/planning-and-menus.md)).
  energy: &energy >-
    **Hungry, or losing weight without trying?** Add calories with olive oil, unsalted butter or more
    measured starch covered by your usual insulin plan, not with more meat, and tell your dietitian
    ([Eating enough](../eating-enough.md)).
  seasoning: &seasoning >-
    **Season without salt:** herbs, spices, garlic and onion powder, lemon and vinegar. Do not use salt
    substitutes: they are potassium chloride ([Sodium](../sodium.md)).
  src_fdc: &src_fdc "[USDA FoodData Central (SR Legacy)][FDC]: every nutrient value, through the app's food list."
  src_q20: &src_q20 "[KDOQI 2020 nutrition guideline][Q20]: energy 25–35 kcal/kg (statement 3.1.1) and protein (statements 3.0.1–3.0.4)."
  src_k24: &src_k24 "[KDIGO 2024 CKD guideline][K24]: sodium under 2 g a day (Rec 3.3.2.1); protein 0.8 g/kg at G3–G5 (Rec 3.3.1.1); limit bioavailable potassium only when it runs high (PP 3.11.5.2)."
  src_a11: &src_a11 "[ADA Standards of Care 2026, section 11][A26-11]: protein 0.8 g/kg with diabetes and CKD before dialysis, 1.0–1.2 g/kg on dialysis (Rec 11.3)."
  src_a5: &src_a5 "[ADA Standards of Care 2026, section 5][A26-5]: consistent carbohydrate in time and amount for people on fixed insulin plans (Rec 5.28)."
  src_dg7: &src_dg7 "[NKF: carbohydrate counting with CKD][DG7]: 15 g is one carbohydrate choice; 3–6 choices per meal, set by your dietitian."

menus:
  - id: g1-g2
    short_title: Stages 1 and 2
    title: "7-day sample menu: stages 1 and 2"
    description: "A plant-forward week for CKD stages 1 and 2 with type 1 diabetes: protein 56–70 g, sodium under 2,000 mg, at least 14 g fibre per 1,000 kcal, about 55 g carbohydrate at each main meal."
    applies_to: [G1-G2]
    targets_row: {stage: "1", dialysis: none}       # stage 1 and stage 2 rows are the same
    carbs_per_meal_g: 55
    carb_tolerance_g: 5
    snack_carbs_g: [10, 30]
    energy_kcal: [1750, 2450]                       # 25–35 kcal/kg (KDOQI 2020 3.1.1)
    potassium_limit: false                          # no limit at G1–G2 unless blood potassium runs high
    phosphorus_limit: false                         # likewise for phosphate (KDOQI 2020 6.3.1)
    fiber_min_per_1000_kcal: 14                     # ADA 2026 Rec 5.24
    rules: [no_phosphate_additive]
    sources: [FDC, Q20, K24, K22, A26-11, A26-5, DG7]
    intro: >-
      At stages 1 and 2 the kidneys still filter well, so there is no potassium or phosphorus limit unless
      your blood tests run high. The goals are the ones that slow kidney disease: sodium under 2,000 mg,
      protein that is enough but not too much (56–70 g for a 70 kg adult, and never more than 1.3 g per
      kg), and a plant-forward pattern with vegetables, fruit, whole grains, beans and nuts. This week has
      fish, poultry or lean beef at one meal on most days, one meat-free day, at least 14 g of fibre per
      1,000 kcal and about 55 g of carbohydrate at each main meal. Potassium and phosphorus are shown for information.
    swaps:
      - "**Beans and lentils** swap ½ cup for ½ cup: each has about 20 g carbohydrate and 7–9 g protein."
      - "**Whole grains** swap at the same carbohydrate: ¾ cup brown rice (39 g), 1 cup whole-wheat pasta (35 g), 1 cup quinoa (39 g), 1 cup oatmeal (28 g)."
      - "**Fish or chicken for beans:** 2 oz of cooked chicken has about 18 g protein and no carbohydrate, so add a starch to keep the meal's carbohydrate steady, and keep the day under 70 g of protein."
      - "**Nuts:** almonds and walnuts swap ounce for ounce. Choose unsalted."
    make_it_yours:
      - "**Scale for your weight.** Protein here is 0.8–1.0 g per kg for 70 kg: 48–60 g a day at 60 kg and 64–80 g at 80 kg. Keep it under 1.3 g per kg. Ask your dietitian which weight to use."
      - "**If a blood test shows high potassium or phosphate,** your team may ask you to limit them; the [stage 3 menu](g3.md) shows how a limited week looks."
      - *carbs
      - *lows
      - *energy
      - *seasoning
      - *log
    source_lines:
      - *src_fdc
      - *src_q20
      - "[KDIGO 2024 CKD guideline][K24]: sodium under 2 g a day (Rec 3.3.2.1); protein 0.8 g/kg and avoid more than 1.3 g/kg (PP 3.3.1.1); limit potassium only when it runs high (PP 3.11.5.2)."
      - "[KDIGO 2022 diabetes in CKD guideline][K22]: a diet high in vegetables, fruits, whole grains, fibre and legumes (practice point 3.1.1)."
      - *src_a11
      - "[ADA Standards of Care 2026, section 5][A26-5]: at least 14 g fibre per 1,000 kcal (Rec 5.24) and consistent carbohydrate on fixed insulin plans (Rec 5.28)."
      - *src_dg7
