  - id: g3
    short_title: Stage 3 (G3a–G3b), no dialysis
    title: "7-day sample menu: stage 3, no dialysis"
    description: "A week of meals for CKD stage 3 with type 1 diabetes: about 56 g protein, sodium well under 2,000 mg, about 55 g carbohydrate at each main meal."
    applies_to: [G3a, G3b]
    targets_row: {stage: "3b", dialysis: none}     # the stricter of the two stage 3 rows (potassium 3,500 mg)
    carbs_per_meal_g: 55
    carb_tolerance_g: 5
    snack_carbs_g: [10, 30]
    energy_kcal: [1750, 2450]                       # 25–35 kcal/kg (KDOQI 2020 3.1.1)
    protein_about_tolerance_pct: 5                  # "about 56 g": at least 56, at most 5 % more
    rules: [no_phosphate_additive]
    sources: [FDC, Q20, K24, A26-11, A26-5, DG7, DG6]
    intro: >-
      This week shows how stage 3 kidney disease with type 1 diabetes can look on the plate: three meals
      with about 55 g of carbohydrate each, small snacks, about 56 g of protein (0.8 g per kg for a
      70 kg adult), sodium well under 2,000 mg and no foods with phosphate additives. Potassium and
      phosphorus stay well under the stage 3 review ceilings without counting every fruit, because at
      stage 3 they are limited only if your blood tests run high. Drink to thirst: there is no fluid
      limit before dialysis unless your team sets one.
    swaps:
      - "**Oatmeal for Cream of Wheat** (1 cup): about +125 mg potassium, +140 mg phosphorus and +2.7 g fibre. Fine at stage 3 when your potassium and phosphate results are in range."
      - "**Whole-wheat for white bread:** about +45 mg potassium and +40 mg phosphorus per slice, with twice the fibre."
      - "**Brown rice for white** (1 cup): about +120 mg potassium, +140 mg phosphorus and +2.6 g fibre."
      - "**Fruit:** any ½ cup of applesauce, blueberries, strawberries, raspberries, grapes or canned pears or peaches can replace another, but check the carbohydrate: ½ cup of grapes is about 14 g, strawberries about 6 g."
      - "**Protein foods:** chicken, turkey, pork loin, cod and pot roast swap ounce for ounce for potassium; salmon and tilapia have more (about 330 mg per 3 oz)."
    make_it_yours:
      - "**Scale for your weight.** Protein here is 0.8 g per kg for 70 kg. At 60 kg that is about 48 g a day, at 80 kg about 64 g: shrink or grow the meat at lunch and dinner by about ½ oz for each 5 kg. Ask your dietitian which weight to use."
      - *carbs
      - *lows
      - *energy
      - *seasoning
      - *log
    source_lines:
      - *src_fdc
      - *src_q20
      - *src_k24
      - *src_a11
      - *src_a5
      - *src_dg7
      - "[Bethke and Jansky 2008][DG6]: boiling small pieces of potato removes about half its potassium (Day 3)."
