# Original recipes for the handbook (handbook/docs/eat/recipes/). Written for this project: never
# copied or adapted from NKF, AKF, DaVita or ADA recipes (docs/dev/research/08-handbook-site.md F10).
#
# Each ingredient is an fdc_id and the grams used for the whole recipe. Most are builtin foods in
# data/foods.json (so a serving can be logged in the app); herbs, spices and a few extras that are not in
# the app's list are under `extra_foods`, with their per-100 g values copied from USDA FoodData Central
# SR Legacy (April 2018, the same release as data/foods.json). Meat and fish are COOKED weights, using the
# app's cooked foods, so the numbers match what you log.
#
# scripts/build_handbook.py turns this file into handbook/docs/eat/recipes/<id>.md and _overview.md and
# fails (exit 1) unless every recipe:
#   * uses only known fdc_ids and no food flagged avoid_ckd or phosphate_additive;
#   * stays at or under the sodium line per serving (600 mg for a meal, 140 mg for a snack or dessert);
#   * meets the line for every tag it carries (see RECIPE_LIMITS in the script and the recipes index page).
# Print every recipe's per-serving numbers with: python scripts/build_handbook.py --totals
#
# Ingredient options: `counts_as_fluid: false` when milk or water is cooked into a solid food (crepe batter),
# so it does not count toward a fluid limit.

last_checked: 2026-10-06
applies_to: [all]
sources: [FDC, DG47, DG5, DG46b, DG37a]
source_lines:
  - "[USDA FoodData Central (SR Legacy)][FDC]: every ingredient value, through the app's food list and the SR Legacy records listed in `handbook/data/recipes.yml`."
  - "[University of Michigan renal diet handout][DG47]: about 600 mg of sodium or potassium per meal as a review line."
  - "[NKF: potassium and your CKD diet][DG5]: 200 mg or more of potassium in a serving is high; [AKF phosphorus food guide][DG46b]: 100 mg or less of phosphorus is low."
  - "[FDA claim definitions][DG37a]: \"low sodium\" means 140 mg or less per serving."

