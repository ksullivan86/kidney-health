SHERMAN09:
  cite: "Sherman RA, Mehta O. Phosphorus and potassium content of enhanced meat and poultry products: implications for patients who receive dialysis. Clin J Am Soc Nephrol 2009;4(8):1370–1373. doi:10.2215/CJN.02830409"
  short: "Sherman and Mehta 2009: enhanced meat and poultry"
