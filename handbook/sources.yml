# Handbook bibliography: one entry per source id.
#
# Pages cite sources with Markdown reference links, for example
#   [KDIGO 2024 CKD guideline][K24], practice point 3.11.5.1
# and list the same ids in their front matter (`sources: [K24, ...]`).
# scripts/build_handbook.py turns this file into includes/sources.md (link definitions appended to
# every page) and docs/reference/sources.md (the rendered bibliography).
# tests/test_handbook_content.py fails when a page cites an id that is not defined here.
#
# Fields
#   cite      full citation (authors, title, journal, year;volume:pages) or publisher and page title
#   short     link text used as the hover title (optional; defaults to cite)
#   url       primary URL (a DOI link where one exists)
#   also      further URLs (optional)
#   licence   what we may do with it. KDIGO is CC BY-NC-ND 4.0: cite and paraphrase, never adapt
#             tables or figures. NKF, AKF, DaVita and ADA pages are copyrighted: link and paraphrase,
#             never copy text, tables or recipes (docs/dev/research/08-handbook-site.md F10).
#   checked   date the URL and the facts we cite from it were last checked (ISO date)
#   kind      guideline | consensus | study | review | patient-info | government | label | data | project | tool
#   dg        source number(s) in the original docs/diet-guide.md §8, kept for traceability
#   note      anything a writer or reviewer must know (optional)
#
# Ids follow docs/dev/research/08-handbook-site.md §5.13. Diet-guide sources without a named id keep
# "DG<n>"; where one diet-guide entry held two different works they are split as DG<n>a / DG<n>b.

