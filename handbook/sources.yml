AKF-thirst:
  cite: "American Kidney Fund. Five tips to beat the heat while maintaining your kidney-friendly fluid plan (2022-08-11)."
  short: "AKF: tips for a fluid plan"
  url: https://www.kidneyfund.org/article/five-tips-beat-heat-while-maintaining-your-kidney-friendly-fluid-plan
  licence: "© American Kidney Fund: link and paraphrase only"
