# ---------------------------------------------------------------- lab results (docs/labs/): reference ranges, assays and devices
MEDLINE-CREAT:
  cite: "MedlinePlus Medical Encyclopedia (US National Library of Medicine). Creatinine blood test (reviewed 13 July 2025)."
  short: "MedlinePlus: creatinine blood test"
  url: https://medlineplus.gov/ency/article/003475.htm
  licence: "© A.D.A.M. (licensed to MedlinePlus): link and paraphrase only"
  checked: 2026-10-06
  kind: patient-info
  note: "Normal: men 0.7–1.3 mg/dL (62–115 µmol/L), women 0.5–0.95 mg/dL (44–84 µmol/L); varies with size and muscle mass; cimetidine, famotidine, cefoxitin and trimethoprim can affect the result."
MEDLINE-CO2:
  cite: "MedlinePlus Medical Encyclopedia (US National Library of Medicine). CO2 blood test (reviewed 19 May 2025)."
  short: "MedlinePlus: CO2 (bicarbonate) blood test"
  url: https://medlineplus.gov/ency/article/003469.htm
  licence: "© A.D.A.M. (licensed to MedlinePlus): link and paraphrase only"
  checked: 2026-10-06
  kind: patient-info
  note: "Normal 23–29 mEq/L (mmol/L). Other names: bicarbonate, HCO3-, total CO2, TCO2. Low levels: kidney disease, ketoacidosis, diarrhea, among others."
MEDLINE-LOWK:
  cite: "MedlinePlus Medical Encyclopedia (US National Library of Medicine). Low blood potassium (reviewed 19 May 2025)."
  short: "MedlinePlus: low blood potassium"
  url: https://medlineplus.gov/ency/article/000479.htm
  licence: "© A.D.A.M. (licensed to MedlinePlus): link and paraphrase only"
  checked: 2026-10-06
  kind: patient-info
  note: "Normal 3.5–5.1 mEq/L (mmol/L). Causes include diuretics, vomiting or diarrhea, chronic kidney disease, low magnesium; symptoms include weakness, cramps, constipation, palpitations; a large drop can cause abnormal heart rhythms."
MEDLINE-CA:
  cite: "MedlinePlus Medical Encyclopedia (US National Library of Medicine). Calcium blood test (reviewed 6 November 2025)."
  short: "MedlinePlus: calcium blood test"
  url: https://medlineplus.gov/ency/article/003477.htm
  licence: "© A.D.A.M. (licensed to MedlinePlus): link and paraphrase only"
  checked: 2026-10-06
  kind: patient-info
  note: "Normal 8.8–10.3 mg/dL (2.20–2.58 mmol/L); about half of blood calcium is bound to proteins, mainly albumin, so low albumin lowers the total calcium result."
MEDLINE-ALB:
  cite: "MedlinePlus Medical Encyclopedia (US National Library of Medicine). Albumin blood (serum) test (reviewed 13 February 2025)."
  short: "MedlinePlus: albumin blood test"
  url: https://medlineplus.gov/ency/article/003480.htm
  licence: "© A.D.A.M. (licensed to MedlinePlus): link and paraphrase only"
  checked: 2026-10-06
  kind: patient-info
  note: "Normal 3.4–5.4 g/dL (34–54 g/L). Low with kidney disease, liver disease, poor intake or absorption, inflammatory bowel conditions; high with dehydration or a tourniquet left on too long."
MEDLINE-GIB:
  cite: "MedlinePlus Medical Encyclopedia (US National Library of Medicine). Gastrointestinal bleeding (reviewed 24 January 2025)."
  short: "MedlinePlus: gastrointestinal bleeding"
  url: https://medlineplus.gov/ency/article/003133.htm
  licence: "© A.D.A.M. (licensed to MedlinePlus): link and paraphrase only"
  checked: 2026-10-06
  kind: patient-info
  note: "Call emergency services for black, tarry stools, a lot of blood in the stool, vomiting blood or coffee-ground material, or dizziness from bleeding."
NIDDK-A1C:
  cite: "NIDDK. The A1C test and diabetes."
  short: "NIDDK: the A1C test"
  url: https://www.niddk.nih.gov/health-information/diagnostic-tests/a1c-test
  licence: "Public domain (NIDDK): reuse with attribution; no NIH or NIDDK logos; some images are licensed"
  checked: 2026-10-06
  kind: government
  note: "Normal below 5.7 %; prediabetes 5.7–6.4 %; diabetes 6.5 % or above. Kidney failure, iron-deficiency anemia, recent blood loss or transfusion and hemoglobin variants can make A1C unreliable."
ISRNM08:
  cite: "Fouque D, et al. A proposed nomenclature and diagnostic criteria for protein–energy wasting in acute and chronic kidney disease (ISRNM). Kidney Int 2008;73:391–398."
  short: "ISRNM 2008: protein-energy wasting criteria"
  url: https://doi.org/10.1038/sj.ki.5002585
  licence: "Publisher copyright: cite and paraphrase only"
  checked: 2026-10-06
  kind: consensus
  note: "Serum albumin under 3.8 g/dL (bromocresol green method); unintended weight loss over 5 % in 3 months or over 10 % in 6 months. Criteria table re-checked via its reproduction in PMC4222262 (design note 05 fact-check)."
ALB18:
  cite: "de Roij van Zuijdewijn CLM, et al. Role of albumin assay on calcium levels and prescription of phosphate binders in chronic hemodialysis patients. Nephron 2018;140(3):211–217."
  short: "de Roij van Zuijdewijn 2018: albumin assays on hemodialysis"
  url: https://doi.org/10.1159/000492238
  also:
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC6262677
  licence: "Publisher copyright (free full text in PMC): cite and paraphrase only"
  checked: 2026-10-06
  kind: study
  note: "Abstract re-read on PubMed (PMID 30212837) 2026-10-06: 506 hemodialysis patients from the CONTRAST cohort, 331 at 9 centres using bromocresol purple and 175 at 16 centres using bromocresol green (different patients, not the same samples). Mean albumin 34.5 vs 40.3 g/L; measured calcium similar, corrected calcium higher in the purple group (2.45 vs 2.33 mmol/L). The earlier note's '521' was not found in the abstract."
BICARB20:
  cite: "BiCARB study group (Witham MD, et al.). Clinical and cost-effectiveness of oral sodium bicarbonate therapy for older patients with chronic kidney disease and low-grade acidosis (BiCARB): a pragmatic randomised, double-blind, placebo-controlled trial. BMC Med 2020;18:91."
  short: "BiCARB trial (2020)"
  url: https://doi.org/10.1186/s12916-020-01542-9
  licence: "CC BY 4.0 (open access)"
  checked: 2026-10-06
  kind: study
  note: "Abstract read on PubMed (PMID 32268897) 2026-10-06: 300 adults aged 60 or over with eGFR under 30 (G4–G5), not on dialysis, bicarbonate under 22 mmol/L; no benefit on physical function or kidney function at 12 months; higher costs, lower EQ-5D quality of life and more adverse events (457 vs 400). KDIGO 2024's text describes the population as 'CKD G3–G4'; the trial report says eGFR under 30."
DEXCOM-G7:
  cite: "Dexcom. Dexcom G7 Continuous Glucose Monitoring System user guide (AW00078-10 Rev 005, 05/2026)."
  short: "Dexcom G7 user guide"
  url: https://dexcompdf.s3.us-west-2.amazonaws.com/en-us/G7-CGM-Users-Guide.pdf
  also:
    - https://www.dexcom.com/en-us/safety-information
  licence: "Product labeling: quote at most one sentence; link and paraphrase"
  checked: 2026-10-06
  kind: label
  note: "Safety statement: don't use if you are on dialysis or critically ill; performance hasn't been evaluated in these populations and readings may be inaccurate. Use a meter when readings don't match symptoms; hydroxyurea makes readings falsely high."
LIBRE-ISI:
  cite: "Abbott. FreeStyle Libre systems: important safety information (US)."
  short: "Abbott FreeStyle Libre safety information"
  url: https://www.freestyle.abbott/us-en/safety-information.html
  licence: "Product labeling: quote at most one sentence; link and paraphrase"
  checked: 2026-10-06
  kind: label
  note: "Libre 3 Plus / 2 Plus: don't use if you are on dialysis or critically ill (not evaluated in these groups); high-dose vitamin C can falsely raise readings; use a blood glucose meter when the reading doesn't match how you feel."

