  licence: "CC BY 4.0 (open access)"
  checked: 2026-10-06
  kind: guideline
  note: "Checked 2026-10-06 (full text, Europe PMC PMC6822421): contraception advice for all women with CKD (3.1.1) and especially within a year of transplant (3.1.2); pre-pregnancy counselling by a team with an obstetrician and nephrologist (3.3.1); higher risk of pre-eclampsia, preterm birth and growth restriction (3.3.2); ACE inhibitor discontinuation plan (3.3.5), ARBs stopped before pregnancy (3.3.6), and in diabetic kidney disease ACE inhibitors continued until conception with regular pregnancy tests (5.4.2); mycophenolate stopped 3 months before conception (2.5); wait usually more than a year after a transplant (5.1.1); long, frequent haemodialysis in pregnancy (5.2.2); PD converted to HD (5.2.4)."
AASM24:
