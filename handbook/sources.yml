    - https://extension.umaine.edu/food-health/2024/03/01/internal-temperatures/
  licence: "Public domain (US government work)"
  checked: 2026-10-06
  kind: government
  note: "Poultry including ground 165 °F (74 °C); ground meats 160 °F; beef, pork, veal and lamb steaks, chops and roasts 145 °F with a 3-minute rest; fish 145 °F or until opaque and flaky; eggs until yolk and white are firm; leftovers and casseroles 165 °F. foodsafety.gov returns 403 to automated checkers; the University of Maine Extension page reproduces the same chart."
MEDLINE-PORTION:
  cite: "MedlinePlus (US National Library of Medicine). Portion size (patient instructions; reviewed 2024-07-24)."
  short: "MedlinePlus: portion size"
  url: https://medlineplus.gov/ency/patientinstructions/000337.htm
  licence: "A.D.A.M. encyclopedia content on MedlinePlus: link and paraphrase only"
  checked: 2026-10-06
  kind: government
  note: "Meat or poultry: palm of the hand or a deck of cards; 3 oz fish: a checkbook; cheese: a pair of dice; ½ cup rice, pasta or snacks: a rounded handful or a tennis ball; 1 cup chopped raw fruit or vegetables: a woman's fist or a baseball; 2 tbsp peanut butter: a ping-pong ball; ¼ cup nuts or dried fruit: a golf ball."
NIDDK-portions:
  cite: "NIDDK. Just enough for you: about food portions (last reviewed July 2021)."
  short: "NIDDK: about food portions"
  url: https://www.niddk.nih.gov/health-information/weight-management/just-enough-food-portions
  licence: "Public domain (NIDDK): reuse with attribution; no NIH or NIDDK logos"
