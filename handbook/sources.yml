ABREU23:
  cite: "de Abreu DBV, Picard K, Klein MRST, Gadas OM, Richard C, Barreto Silva MI. Soaking to reduce potassium and phosphorus content of foods. J Ren Nutr 2023;33(1):165–171. doi:10.1053/j.jrn.2022.06.010"
  short: "de Abreu 2023: soaking foods in hot water"
  url: https://pubmed.ncbi.nlm.nih.gov/35803495/
  licence: "Publisher copyright: cite and paraphrase only"
  checked: 2026-10-06
  kind: study
  note: "KDIGO 2024 reference 599. 20 Brazilian staple foods soaked 5–10 minutes in just-boiled water (5 parts water to 1 part food). Potassium fell 40–49 % in beef, leafy greens and grains; 30–39 % in chicken, fish and non-leafy vegetables; 10–20 % in tubers. Phosphorus fell 30–39 % in grains and beans, 20–29 % in non-leafy vegetables, 10–20 % in meat and fish."

