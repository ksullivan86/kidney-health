JBDS22:
  cite: "Frankel AH, Wahba M, Ashworth V, et al. Management of adults with diabetes on dialysis: summary of recommendations of the Joint British Diabetes Societies guidelines 2022. Diabet Med 2023;40(4):e15027. Full guideline: JBDS-IP, Management of adults with diabetes on dialysis (JBDS 11, August 2022)."
  short: "JBDS 2022 guidance: diabetes on dialysis"
  url: https://doi.org/10.1111/dme.15027
  also:
    - https://ukkidney.org/sites/default/files/JBDS_11_Renal_Guide_August_2022.pdf
  licence: "Publisher copyright: cite and paraphrase only"
  checked: 2026-10-06
  kind: guideline
  note: "Updates the 2016 hemodialysis guidance (JBDS) and adds peritoneal dialysis. Read in the full PDF 2026-10-06. Rec 2.7: do not use glucose oxidase or GDH-PQQ meters on dialysis; 2.9: real-time CGM for recurrent lows or lost awareness; 3B.5: lower insulin on hemodialysis days may reduce lows, CGM is a better guide (dose figures deliberately not repeated in the handbook); 5A.1: pre-dialysis glucose under 7 mmol/L (126 mg/dL): 20–30 g low-GI carbohydrate at the start of the session; 5A.2: check before and after hemodialysis; 5A.3: a low treatment always within reach, including on the journey; 5A.4: rescue carbohydrate chosen for fluid, potassium and phosphate limits. PD (section 6): insulin under the skin only, not in the bags (6.8–6.9); glucose dialysate may raise insulin needs (6.10); CAPD can absorb up to 100–200 g glucose a day (400–800 kcal); icodextrin meter interference lasts at least two weeks after stopping; CGM accuracy on PD has limited data (2.8). DKA (5D): rarer but happens on dialysis; ketone levels were lower in ESKD; ketones above 3.0 mmol/L need immediate assessment; signs of dehydration and deep breathing may be missing; people may miss sessions because of DKA symptoms."
