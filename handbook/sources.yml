  checked: 2026-10-06
  kind: guideline
  note: "Abstract read on Europe PMC (PMID 39324694) 2026-10-06. Check ferritin and TSAT; iron if ferritin ≤ 75 ng/mL or TSAT < 20 %; gabapentinoids are strong recommendations; suggests against standard use of dopamine agonists (augmentation). With kidney failure (ESRD): suggests gabapentin, IV iron sucrose when ferritin < 200 ng/mL and TSAT < 20 %, and vitamin C; suggests against standard use of levodopa and rotigotine. Address caffeine, alcohol, antihistamines and untreated sleep apnoea first."
