LEON13:
  cite: "León JB, Sullivan CM, Sehgal AR. The prevalence of phosphorus-containing food additives in top-selling foods in grocery stores. J Ren Nutr 2013;23(4):265–270.e2. doi:10.1053/j.jrn.2012.12.003"
