  checked: 2026-10-05
  kind: guideline
  note: "2016 summary (recommendations re-read in the local PDF text 2026-10-06): HbA1c by HPLC to avoid carbamylation; HbA1c underestimates unless iron deficient; target 58–68 mmol/mol (7.5–8.5 %) with treatments that cause lows; glycated albumin for research; CGM lag longer in kidney failure; start CGM on a non-dialysis day (calibration); glucose most often drops in the last hour of dialysis and is lowest afterwards; hypoglycaemia unawareness common. Updated by JBDS22, which no longer gives the A1c target: cite JBDS22 for current dialysis targets."
